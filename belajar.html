<style>
:root{--bg:#141714;--bg2:#181c18;--panel:#1c201c;--panel2:#242924;--line:#2c322c;--fg:#eef0e8;--muted:#a6ad9f;--gold:#5b9cf5;--gold-hi:#8dbbff;--gold-lo:#3f80dc;--up:#66cf92;--up-dim:#163a27;--down:#e86a64;
 --f-display:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;--f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;--f-mono:"Inter",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:radial-gradient(900px 500px at 90% -10%,rgba(91,156,245,.10),transparent 60%),var(--bg);font-feature-settings:"tnum" 1;color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.65;min-height:100vh}
a{color:var(--gold)}
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,0.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-left,0px))}
.back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--fg);font-weight:600;font-size:14px;border:1px solid var(--line);border-radius:12px;padding:7px 12px;background:var(--panel)}
.brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0;text-decoration:none;color:var(--fg)}
.brand svg{width:26px;height:auto;flex:none}
.brand b{font-family:var(--f-display);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:430px){.back span{display:none}.back{padding:7px 9px}}
.brand b i{font-style:normal;color:#1f7a5a}
.pill{font-family:var(--f-display);font-size:11px;font-weight:700;letter-spacing:.06em;border-radius:99px;padding:4px 10px;border:1px solid #bfd2ef;color:var(--gold);background:#e3ecfa;text-decoration:none;white-space:nowrap}
.pill.ok{border-color:#17604a;color:var(--up);background:var(--up-dim)}
.wrap{max-width:760px;margin:0 auto;padding:22px max(16px,env(safe-area-inset-left,0px)) 80px}
.hero h1{font-family:var(--f-display);font-size:30px;line-height:1.15;margin:6px 0 10px}
.hero h1 em{font-style:normal;color:var(--gold)}
.eyb{font-family:var(--f-display);font-size:12px;font-weight:700;letter-spacing:.22em;color:var(--up)}
.lead{color:var(--muted);margin:0}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.stats span{font-size:13px;border:1px solid var(--line);border-radius:99px;padding:5px 12px;background:var(--panel);color:#5f6f68}
.lvl{margin-top:30px}
.lvh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.lvh h2{font-family:var(--f-display);font-size:20px;margin:0}
.lvh .tag{font-family:var(--f-display);font-size:11px;font-weight:700;letter-spacing:.08em;border-radius:99px;padding:3px 10px}
.tag.free{background:var(--up);color:#06261b}.tag.vip{background:var(--gold);color:#fff}
.lvh p{margin:0;color:var(--muted);font-size:13.5px}
.card{display:flex;gap:14px;align-items:center;text-decoration:none;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:8px}
.card:active{background:var(--panel2)}
.num{width:38px;height:38px;border-radius:12px;flex:none;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;background:var(--panel2);border:1px solid var(--line);color:var(--gold)}
.card.done .num{background:var(--up-dim);color:var(--up);border-color:#17604a}
.card h3{margin:0;font-size:15.5px;line-height:1.35}
.card p{margin:2px 0 0;font-size:13px;color:var(--muted);line-height:1.45}
.card .mt{flex:1;min-width:0}
.card .ic{flex:none;color:var(--muted);width:18px;height:18px}
.card .ic.lock{color:var(--gold)}
/* lesson */
.crumb{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.crumb a{color:var(--muted);text-decoration:none}
.lt{font-family:var(--f-display);font-size:27px;line-height:1.2;margin:8px 0 6px}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted);margin-bottom:18px}
.body h3{font-family:var(--f-display);font-size:19px;margin:26px 0 8px;color:var(--fg)}
.body p{margin:0 0 12px;color:#3f4d47}
.body ul,.body ol{margin:0 0 14px;padding-left:22px;color:#3f4d47}
.body li{margin:4px 0}
.body b{color:var(--fg)}
.body .k{font-family:var(--f-mono);font-size:14px;color:var(--gold-hi);background:#e3ecfa;border-radius:6px;padding:1px 6px}
.fig{margin:16px 0 18px;background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:10px;overflow:hidden}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:12.5px;color:var(--muted);padding:8px 4px 2px;line-height:1.45}
.box{border-radius:14px;padding:12px 14px;margin:14px 0;font-size:14.5px;line-height:1.55}
.box.tip{background:var(--up-dim);border:1px solid #bae8d8;color:#1f7a5a}
.box.warn{background:#f3e7e9;border:1px solid #e4bec6;color:#9f2335}
.box.note{background:#e3ecfa;border:1px solid #bfd2ef;color:#2f5fa8}
.box b{color:inherit}
.tbl{width:100%;border-collapse:collapse;margin:8px 0 16px;font-size:14px}
.tblw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl th,.tbl td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-family:var(--f-display);font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:600}
.tbl td{color:#3f4d47}
/* quiz */
.quiz{margin-top:28px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}
.quiz h3{font-family:var(--f-display);font-size:18px;margin:0 0 4px}
.qq{margin-top:18px}
.qq .q{font-weight:600;margin-bottom:8px}
.opt{display:block;width:100%;text-align:left;font:inherit;font-size:15px;color:var(--fg);background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-top:7px;cursor:pointer}
.opt.right{border-color:var(--up);background:var(--up-dim)}
.opt.wrong{border-color:var(--down);background:#f3e7e9}
.opt:disabled{cursor:default}
.exp{font-size:14px;margin-top:8px;color:#1f7a5a}
.exp.bad{color:#9f2335}
.score{margin-top:16px;font-weight:700;font-family:var(--f-display)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-weight:700;font-size:15px;border-radius:14px;padding:12px 16px;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--fg);text-decoration:none}
.btn.gold{background:var(--up);color:#06261b;border:0}
.btn.green{background:var(--up);color:#06261b;border:0}
.nav2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
.nav2 a{display:block;text-decoration:none;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;font-size:13px}
.nav2 a span{display:block;color:var(--muted);font-size:12px}
.nav2 a.r{text-align:right}
.lockc{position:relative;margin-top:6px}
.lockc .fade{max-height:170px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 30%,transparent);mask-image:linear-gradient(#000 30%,transparent)}
.lockcard{background:linear-gradient(160deg,#e3ecfa,#ffffff 70%);border:1px solid #bfd2ef;border-radius:18px;padding:20px;text-align:center}
.lockcard svg{width:36px;height:36px;color:var(--gold)}
.lockcard h3{font-family:var(--f-display);font-size:19px;margin:8px 0 6px}
.lockcard p{color:var(--muted);margin:0 0 14px;font-size:14px}
.lockcard .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.disc{font-size:12px;color:var(--muted);text-align:center;margin-top:30px}
*{letter-spacing:normal!important;text-transform:none!important}
.hero h1,.lt,.lvh h2{letter-spacing:-.02em!important;font-weight:800}
.eyb{font-size:14px;font-weight:600}
.btn,.back{border-radius:999px}
.card{border-color:transparent}
.pill{font-size:12px}

<script>
/* ===== Pembuat ilustrasi chart (SVG) ===== */
const COL={up:"#2fd39b",dn:"#f05d6c",gold:"#5b9cf5",gh:"#bcd6ff",mut:"#9b978d",fg:"#f2efe8",line:"#2a2a31",blue:"#6aa9ff",purple:"#b58cff"};
function chart(cl,o={}){
 const W=o.w||640,H=o.h||260,P=14,R=o.right==null?96:o.right,T=o.top||14;
 const cs=o.raw||cl.map((c,i)=>{const op=i?cl[i-1]:c-(cl[1]-c||1);const body=Math.abs(c-op);
   const w=(o.wick!=null?o.wick:Math.max(.35,body*.4))*(.55+((i*37)%10)/14);
   const ex=(o.wk&&o.wk[i])||[0,0];return [op,Math.max(op,c)+w+ex[0],Math.min(op,c)-w*.8-ex[1],c]});
 let vals=cs.flatMap(c=>[c[1],c[2]]);
 (o.lines||[]).forEach(l=>vals.push(l.v));(o.zones||[]).forEach(z=>vals.push(z.a,z.b));(o.boxes||[]).forEach(z=>vals.push(z.a,z.b));(o.labels||[]).forEach(z=>vals.push(z.v));
 let mn=Math.min(...vals),mx=Math.max(...vals);const pd=(mx-mn)*.08||1;mn-=pd;mx+=pd;
 const y=v=>T+(mx-v)/(mx-mn)*(H-T-P),n=cs.length,step=(W-P-R)/n,x=i=>P+step*(i+.5),bw=Math.max(3,Math.min(18,step*.62));
 let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" font-family="Inter,system-ui,sans-serif">`;
 for(let k=1;k<4;k++){const yy=T+(H-T-P)*k/4;s+=`<line x1="${P}" x2="${W-P}" y1="${yy}" y2="${yy}" stroke="#1f1f25" stroke-width="1"/>`}
 (o.zones||[]).forEach(z=>{const c=z.c||COL.gold;s+=`<rect x="${z.x1!=null?x(z.x1)-step/2:P}" y="${y(Math.max(z.a,z.b))}" width="${(z.x1!=null?W-R-(x(z.x1)-step/2):W-P-R)}" height="${Math.abs(y(z.a)-y(z.b))}" fill="${c}" fill-opacity=".14" stroke="${c}" stroke-opacity=".5" stroke-dasharray="4 4"/>`;
   if(z.t)s+=`<text x="${W-R+6}" y="${(y(z.a)+y(z.b))/2+4}" fill="${c}" font-size="13" font-weight="600">${z.t}</text>`});
 (o.boxes||[]).forEach(z=>{const c=z.c||COL.gold,x1=x(z.i1)-step/2,x2=x(z.i2)+step/2;s+=`<rect x="${x1}" y="${y(Math.max(z.a,z.b))}" width="${x2-x1}" height="${Math.abs(y(z.a)-y(z.b))}" fill="${c}" fill-opacity=".16" stroke="${c}" stroke-opacity=".7"/>`;
   if(z.t)s+=`<text x="${x1+4}" y="${y(Math.max(z.a,z.b))-5}" fill="${c}" font-size="12.5" font-weight="700">${z.t}</text>`});
 (o.lines||[]).forEach(l=>{const c=l.c||COL.gold,x1=l.i1!=null?x(l.i1):P,x2=l.i2!=null?x(l.i2):W-R;s+=`<line x1="${x1}" x2="${x2}" y1="${y(l.v)}" y2="${y(l.v)}" stroke="${c}" stroke-width="${l.sw||1.6}" ${l.dash===false?"":'stroke-dasharray="6 5"'}/>`;
   if(l.t)s+=`<text x="${l.tx!=null?l.tx:W-R+6}" y="${y(l.v)+4+(l.dy||0)}" fill="${c}" font-size="13" font-weight="600">${l.t}</text>`});
 (o.ema||[]).forEach(e=>{const k=2/(e.p+1);let v=cs[0][3];const pts=cs.map((c,i)=>{v=i?c[3]*k+v*(1-k):c[3];return `${x(i).toFixed(1)},${y(v).toFixed(1)}`});
   s+=`<polyline points="${pts.join(" ")}" fill="none" stroke="${e.c}" stroke-width="2"/>`;if(e.t)s+=`<text x="${W-R+6}" y="${+pts[pts.length-1].split(",")[1]+4}" fill="${e.c}" font-size="12.5" font-weight="600">${e.t}</text>`});
 cs.forEach((c,i)=>{const up=c[3]>=c[0],col=up?COL.up:COL.dn,xx=x(i);
   s+=`<line x1="${xx}" x2="${xx}" y1="${y(c[1])}" y2="${y(c[2])}" stroke="${col}" stroke-width="1.6"/>`;
   const t=y(Math.max(c[0],c[3])),h=Math.max(1.5,Math.abs(y(c[0])-y(c[3])));s+=`<rect x="${xx-bw/2}" y="${t}" width="${bw}" height="${h}" rx="1.5" fill="${col}"/>`});
 if(o.path){s+=`<polyline points="${o.path.map(p=>`${x(p[0])},${y(p[1])}`).join(" ")}" fill="none" stroke="${o.pc||COL.gh}" stroke-width="2" stroke-dasharray="${o.pdash||"0"}"/>`}
 (o.arrows||[]).forEach(a=>{const xx=x(a.i),yy=y(a.v),c=a.c||(a.d==="up"?COL.up:COL.dn);s+=a.d==="up"?`<path d="M${xx} ${yy} l-7 12 h14z" fill="${c}"/>`:`<path d="M${xx} ${yy} l-7 -12 h14z" fill="${c}"/>`});
 (o.labels||[]).forEach(l=>{const c=l.c||COL.fg;s+=`<text x="${x(l.i)+(l.dx||0)}" y="${y(l.v)+(l.dy||0)}" fill="${c}" font-size="${l.fs||13}" font-weight="700" text-anchor="${l.a||"middle"}">${l.t}</text>`});
 return s+"</svg>";
}
const fig=(svg,cap)=>`<figure class="fig">${svg}${cap?`<figcaption>${cap}</figcaption>`:""}</figure>`;
const tbl=(head,rows)=>`<div class="tblw"><table class="tbl"><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</table></div>`;
const box=(t,h)=>`<div class="box ${t}">${h}</div>`;
/* ===== Mesin chart realistis (gaya TradingView) ===== */
const TV={bg:"#161a1e",grid:"#20262c",axis:"#7d858f",up:"#26a69a",dn:"#ef5350",blue:"#4c8ef7",gold:"#e0b04a",purple:"#a77bf3",txt:"#d1d4dc",orange:"#f39c4a"};
function rng(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return s/4294967296}}
function gauss(r){let u=0,v=0;while(!u)u=r();while(!v)v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function genCandles(o){
 const n=o.n||60,r=rng(o.seed||7),pts=o.pts,vol=o.vol||1.2,wk=o.wick==null?1:o.wick;
 const T=i=>{for(let k=0;k<pts.length-1;k++){const [a,pa]=pts[k],[b,pb]=pts[k+1];if(i>=a&&i<=b)return pa+(pb-pa)*(i-a)/(b-a)}return i<pts[0][0]?pts[0][1]:pts[pts.length-1][1]};
 const cs=[],W0=o.warm==null?30:o.warm;let prev=T(0)+(r()-.5)*vol,e=0;
 for(let i=-W0;i<n;i++){
  let c;const op=prev;
  if(i>=0&&o.set&&o.set[i]){const d=o.set[i];const oo=op+(d[0]||0),h=op+d[1],l=op+d[2],cc=op+d[3];cs.push([oo,Math.max(h,oo,cc),Math.min(l,oo,cc),cc]);prev=cc;e=cc-T(i);continue}
  const vf=o.vk?o.vk(i):1;e=e*.55+gauss(r)*vol*.7*vf;c=T(i)+e;
  const body=Math.abs(c-op),v=vol*(.35+r()*.5)*wk*vf;
  const h=Math.max(op,c)+Math.abs(gauss(r))*v*.85+body*.06,l=Math.min(op,c)-Math.abs(gauss(r))*v*.85-body*.06;
  cs.push([op,h,l,c]);prev=c;
 }
 cs.warm=W0;return cs;
}
function emaArr(v,p){const k=2/(p+1);let e=v[0];return v.map((x,i)=>e=i?x*k+e*(1-k):x)}
function rsiArr(c,p=14){const out=[];let g=0,l=0;for(let i=0;i<c.length;i++){if(i===0){out.push(50);continue}const d=c[i]-c[i-1];const G=Math.max(d,0),Lo=Math.max(-d,0);if(i<=p){g+=G/p;l+=Lo/p}else{g=(g*(p-1)+G)/p;l=(l*(p-1)+Lo)/p}out.push(l===0?100:100-100/(1+g/l))}return out}
const fmtP=(v,d=2)=>v.toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
function niceStep(range,t=5){const raw=range/t,p=Math.pow(10,Math.floor(Math.log10(raw))),m=raw/p;return (m<1.5?1:m<2.25?2:m<3.5?2.5:m<7.5?5:10)*p}
function rc(o){
 const ALL=o.cs||genCandles(o),WM=ALL.warm||0,cs=ALL.slice(WM),n=cs.length,W=o.w||640,AX=86,BX=28,TP=8;
 const subH=o.sub?110:0,H=(o.h||340)+subH,MH=(o.h||340)-BX-(o.sub?0:0);
 const R=k=>{if(typeof k==="number")return k;if(typeof k==="function")return k(cs);const t=k[0],i=+k.slice(1);return t==="h"?cs[i][1]:t==="l"?cs[i][2]:t==="o"?cs[i][0]:cs[i][3]};
 let vals=cs.flatMap(c=>[c[1],c[2]]);
 const extra=[];(o.zones||[]).forEach(z=>extra.push(R(z.a),R(z.b)));(o.lines||[]).forEach(l=>extra.push(R(l.v)));(o.rr||[]).forEach(p=>extra.push(R(p.e),R(p.sl),R(p.tp)));
 if(o.fit!==false)vals=vals.concat(extra);
 let mn=Math.min(...vals),mx=Math.max(...vals);const pad=(mx-mn)*(o.pad||.1);mn-=pad;mx+=pad;
 const pw=W-AX,step=pw/(n+(o.space==null?3:o.space)),bw=Math.max(2,step*.68);
 const X=i=>step*(i+.5)+2,Y=v=>TP+(mx-v)/(mx-mn)*(MH-TP);
 const uid="c"+Math.floor(Math.random()*1e9);
 let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" font-family="Inter,system-ui,sans-serif" style="background:${TV.bg};border-radius:12px"><defs><clipPath id="${uid}"><rect x="0" y="0" width="${pw}" height="${MH}"/></clipPath></defs>`;
 // grid + axis
 const st=niceStep(mx-mn,o.ticks||6),d=o.dec==null?2:o.dec;
 for(let v=Math.ceil(mn/st)*st;v<=mx;v+=st){const y=Y(v);s+=`<line x1="0" x2="${pw}" y1="${y}" y2="${y}" stroke="${TV.grid}"/><text x="${pw+6}" y="${y+4}" fill="${TV.axis}" font-size="15">${fmtP(v,d)}</text>`}
 const tf=o.tf||15,start=o.start||[8,0],every=o.every||Math.max(4,Math.round(n/6));
 for(let i=0;i<n;i+=every){const mins=start[0]*60+start[1]+i*tf,hh=Math.floor(mins/60)%24,mm=mins%60;s+=`<line x1="${X(i)}" x2="${X(i)}" y1="0" y2="${MH}" stroke="${TV.grid}"/><text x="${X(i)}" y="${MH+20}" fill="${TV.axis}" font-size="15" text-anchor="middle">${o.dates?o.dates(i):String(hh).padStart(2,"0")+":"+String(mm).padStart(2,"0")}</text>`}
 s+=`<line x1="${pw}" x2="${pw}" y1="0" y2="${MH}" stroke="#2a3038"/><line x1="0" x2="${W}" y1="${MH}" y2="${MH}" stroke="#2a3038"/>`;
 s+=`<g clip-path="url(#${uid})">`;
 // bands (sesi)
 (o.bands||[]).forEach(b=>{const x1=X(b.i1)-step/2,x2=X(b.i2)+step/2;s+=`<rect x="${x1}" y="0" width="${x2-x1}" height="${MH}" fill="${b.c}" fill-opacity=".09"/><text x="${x1+6}" y="${MH-8}" fill="${b.c}" font-size="16" font-weight="700">${b.t}</text>`});

function anatomySvg(){const c=(x,o,cl,h,l,col)=>{const t=Math.min(o,cl),b=Math.max(o,cl);return `<line x1="${x}" x2="${x}" y1="${h}" y2="${l}" stroke="${col}" stroke-width="3"/><rect x="${x-26}" y="${t}" width="52" height="${b-t}" rx="2" fill="${col}"/>`};
 const lab=(x,yy,t,col="#d1d4dc",a="start")=>`<line x1="${a==="start"?x-36:x+36}" x2="${a==="start"?x-6:x+6}" y1="${yy}" y2="${yy}" stroke="#4a525c" stroke-dasharray="3 3"/><text x="${x}" y="${yy+4}" fill="${col}" font-size="17" font-weight="600" text-anchor="${a}">${t}</text>`;
 return `<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" font-family="Inter,system-ui" style="background:${TV.bg};border-radius:12px">${c(190,190,80,40,225,TV.up)}${c(450,80,190,40,225,TV.dn)}
 ${lab(232,40,"High")}${lab(232,80,"Close",TV.up)}${lab(232,190,"Open",TV.up)}${lab(232,225,"Low")}${lab(132,135,"Body","#d1d4dc","end")}
 ${lab(492,40,"High")}${lab(492,80,"Open",TV.dn)}${lab(492,190,"Close",TV.dn)}${lab(492,225,"Low")}${lab(392,60,"Wick","#d1d4dc","end")}
 <text x="190" y="252" fill="${TV.up}" font-size="18" font-weight="700" text-anchor="middle">Bullish</text><text x="450" y="252" fill="${TV.dn}" font-size="18" font-weight="700" text-anchor="middle">Bearish</text></svg>`}

const L=[];
L.push({id:"pengenalan",lvl:"dasar",min:5,t:"Apa itu trading emas (XAUUSD)?",d:"Cara kerja trading emas, buy & sell, broker, dan risikonya",
body:()=>`<p><b>XAUUSD</b> adalah harga 1 troy ons emas (sekitar 31,1 gram) dalam dolar Amerika. Kalau di layar tertulis 3850,00, artinya 1 ons emas sedang dihargai 3.850 dolar.</p>
<p>Saat trading emas di broker seperti PU Prime, kamu <b>tidak membeli emas fisik</b>. Kamu memperdagangkan <b>CFD</b> (Contract for Difference), yaitu kontrak yang mengikuti naik-turunnya harga. Keuntungan atau kerugianmu adalah selisih harga saat posisi dibuka dan ditutup.</p>
<h3>Bisa untung saat naik maupun turun</h3>
<ul><li><b>BUY</b> (beli): kamu memperkirakan harga akan <b>naik</b>. Untung jika harga ditutup lebih tinggi dari harga masukmu.</li>
<li><b>SELL</b> (jual): kamu memperkirakan harga akan <b>turun</b>. Untung jika harga ditutup lebih rendah dari harga masukmu.</li></ul>
${fig(FIG.buy(),"Contoh BUY di XAUUSD M15: masuk saat harga di bawah, posisi ditutup setelah harga naik. Selisihnya menjadi keuntungan.")}
${fig(FIG.sell(),"Contoh SELL: masuk saat harga di atas, posisi ditutup setelah harga turun.")}
<h3>Siapa saja yang terlibat?</h3>
<ul><li><b>Broker</b> (misalnya PU Prime): perusahaan perantara yang menyediakan harga dan tempat membuka posisi.</li>
<li><b>Platform</b>: aplikasi untuk trading, umumnya <b>MetaTrader 5 (MT5)</b>, tersedia di HP dan komputer.</li>
<li><b>Akun trading</b>: tempat dana (modal) disimpan. Ada akun <b>demo</b> (uang virtual) dan <b>real</b> (uang sungguhan).</li></ul>
<h3>Kenapa emas populer?</h3>
<p>Emas bergerak cukup jauh setiap hari (volatil), sangat likuid, dan sering dipengaruhi berita ekonomi Amerika, suku bunga, serta kondisi geopolitik. Pergerakan besar berarti peluang besar, tetapi juga <b>risiko besar</b>.</p>
${box("warn","<b>Penting:</b> sebagian besar trader ritel CFD mengalami kerugian. Leverage membuat untung dan rugi sama-sama membesar. Selalu mulai dari akun demo dan hanya pakai dana yang siap hilang.")}`,
quiz:[{q:"Apa arti XAUUSD 3850,00?",o:["Harga 1 gram emas dalam rupiah","Harga 1 troy ons emas dalam dolar AS","Harga 1 kg emas dalam dolar AS"],a:1,e:"XAUUSD adalah harga 1 troy ons (±31,1 gram) emas dalam dolar Amerika."},
{q:"Kamu memperkirakan harga emas akan turun. Posisi apa yang dibuka?",o:["BUY","SELL","Tidak bisa, hanya bisa untung saat naik"],a:1,e:"SELL dipakai saat memperkirakan harga turun. Trading CFD bisa untung dua arah."},
{q:"Saat trading XAUUSD di broker CFD, apakah kamu memiliki emas fisik?",o:["Ya, dikirim ke rumah","Tidak, hanya memperdagangkan selisih harga","Ya, disimpan di bank"],a:1,e:"CFD hanya mengikuti harga. Kamu tidak memiliki emas fisik."}]});

L.push({id:"istilah",lvl:"dasar",min:7,t:"Istilah penting: pip, lot, spread & leverage",d:"Hitung nilai per pip, margin, dan arti saldo di MT5",
body:()=>`<p>Sebelum membuka posisi pertama, kamu wajib paham beberapa istilah ini. Hampir semua kesalahan pemula berawal dari salah memahami <b>lot</b> dan <b>pip</b>.</p>
<h3>Bid, Ask & Spread</h3>
<p><b>Ask</b> adalah harga saat kamu BUY, <b>Bid</b> adalah harga saat kamu SELL. Selisih keduanya disebut <b>spread</b>, yaitu biaya yang langsung terasa saat posisi dibuka. Spread emas bisa melebar saat berita besar atau pasar sepi.</p>
${fig(FIG.spread(),"Garis biru = Ask (harga BUY), garis merah = Bid (harga SELL). Jarak di antara keduanya adalah spread.")}
<h3>Pip & point</h3>
<p>Di DirmuFX, <b>1 pip emas = 0,10 pergerakan harga</b>. Contoh: dari <span class="k">3850,00</span> ke <span class="k">3850,10</span> = 1 pip. Dari <span class="k">3850,00</span> ke <span class="k">3853,00</span> = 30 pip. Satuan terkecil di MT5 (0,01) disebut <b>point</b>.</p>
${box("note","Setiap broker bisa berbeda cara menyebut pip. Yang paling aman: hitung dari <b>selisih harga</b>. SL 3,00 dolar dari entry = 30 pip versi DirmuFX.")}
<h3>Lot & nilai per pip</h3>
<p>Lot adalah ukuran posisi. Untuk emas, umumnya <b>1 lot = 100 ons</b>. Artinya setiap pergerakan 1 dolar pada harga emas bernilai $100 per 1 lot.</p>
${tbl(["Lot","Nilai per pip (0,10)","Gerak 3,00 (30 pip)"],[["1,00","$10","$300"],["0,10","$1","$30"],["0,01","$0,10","$3"]])}
<p><b>Contoh:</b> BUY 0,01 lot di 3850,00, lalu ditutup di 3853,00. Untung = 30 pip × $0,10 = <b>$3</b> (belum termasuk spread).</p>
<h3>Leverage & margin</h3>
<p><b>Leverage</b> memungkinkanmu membuka posisi besar dengan modal kecil. Dana yang "ditahan" broker sebagai jaminan disebut <b>margin</b>.</p>
<p>Rumus kasar: <span class="k">margin = harga × 100 × lot ÷ leverage</span>. Contoh 0,01 lot di harga 3850 dengan leverage 1:500 → 3850 × 100 × 0,01 ÷ 500 = <b>$7,70</b>.</p>
<h3>Angka di tab Trade MT5</h3>
<ul><li><b>Balance</b>: saldo tanpa posisi terbuka.</li><li><b>Equity</b>: saldo + untung/rugi posisi yang sedang berjalan.</li><li><b>Free margin</b>: dana yang masih bisa dipakai membuka posisi baru.</li><li><b>Margin level</b>: equity ÷ margin × 100%. Kalau terlalu rendah, broker menutup posisimu otomatis (<b>stop out</b>).</li></ul>
${box("tip","<b>Akun cent:</b> saldo ditampilkan dalam sen (USC). Deposit $30 terlihat sebagai 3.000 USC. Cocok untuk modal kecil karena ukuran lot bisa dibuat sangat kecil.")}`,
quiz:[{q:"Harga bergerak dari 3850,00 ke 3852,00. Berapa pip (versi DirmuFX)?",o:["2 pip","20 pip","200 pip"],a:1,e:"1 pip = 0,10. Gerak 2,00 ÷ 0,10 = 20 pip."},
{q:"Berapa nilai 1 pip untuk posisi 0,01 lot emas?",o:["$0,10","$1","$10"],a:0,e:"0,01 lot = 1 ons. Gerak 0,10 × 1 ons = $0,10 per pip."},
{q:"Apa yang dimaksud spread?",o:["Komisi bulanan broker","Selisih harga Ask dan Bid","Jarak SL ke entry"],a:1,e:"Spread adalah selisih harga beli (Ask) dan harga jual (Bid)."},
{q:"Equity adalah…",o:["Saldo + untung/rugi posisi yang berjalan","Jumlah deposit pertama","Dana jaminan posisi"],a:0,e:"Equity berubah mengikuti posisi yang masih terbuka."}]});

L.push({id:"sesi",lvl:"dasar",min:5,t:"Sesi pasar & jam terbaik (WITA)",d:"Kapan emas ramai bergerak dan kapan sebaiknya diam",
body:()=>`<p>Pasar emas buka 24 jam dari Senin pagi sampai Sabtu dini hari (WITA). Tetapi karakter pergerakannya berbeda di tiap sesi, karena pelaku pasar di Asia, Eropa, dan Amerika aktif di jam yang berbeda.</p>
${fig(FIG.sesi(),"Contoh pergerakan emas dalam sehari (WITA): sesi Asia sempit, London mulai menembus range, New York paling volatil. Saat musim panas Eropa/Amerika, London & New York maju 1 jam.")}
${tbl(["Sesi","Jam (WITA)","Karakter emas"],[["Asia (Tokyo)","± 07.00 – 16.00","Cenderung tenang, sering membentuk range"],["London","± 16.00 – 01.00","Volume naik, sering terjadi breakout dari range Asia"],["New York","± 21.00 – 06.00","Paling volatil, banyak rilis berita Amerika"],["Overlap London–NY","± 21.00 – 01.00","Pergerakan terbesar dalam sehari"]])}
<h3>Jam berita penting</h3>
<p>Data ekonomi Amerika (CPI, NFP, klaim pengangguran) biasanya rilis pukul <b>21.30 WITA</b> (20.30 saat musim panas). Keputusan suku bunga The Fed (FOMC) sekitar <b>03.00 WITA</b> (02.00 saat musim panas). Cek tab <b>Kalender</b> di Signal Room setiap hari.</p>
${box("warn","Hindari membuka posisi baru <b>15 menit sebelum sampai 15 menit sesudah</b> berita berdampak tinggi. Spread melebar dan harga bisa melompat melewati stop loss.")}
${box("tip","Untuk scalping dan intraday, jam paling efektif biasanya awal sesi London (16.00–18.00 WITA) dan overlap London–New York (21.00–01.00 WITA).")}`,
quiz:[{q:"Sesi mana yang biasanya paling volatil untuk emas?",o:["Asia","Overlap London–New York","Sabtu siang"],a:1,e:"Saat London dan New York aktif bersamaan, volume dan pergerakan paling besar."},
{q:"Data CPI/NFP Amerika saat musim dingin biasanya rilis jam berapa WITA?",o:["09.00","21.30","15.00"],a:1,e:"Data Amerika rilis 08.30 waktu New York = 21.30 WITA (musim dingin)."},
{q:"Apa yang sebaiknya dilakukan menjelang berita berdampak tinggi?",o:["Tambah lot agar untung besar","Hindari posisi baru sekitar waktu rilis","Hapus stop loss"],a:1,e:"Spread melebar dan harga bisa melompat. Lebih aman menunggu."}]});

L.push({id:"mt5",lvl:"dasar",min:6,t:"Mengenal MT5 & jenis order",d:"Market order, Buy/Sell Limit, Buy/Sell Stop, cara pasang SL & TP",
body:()=>`<p>MetaTrader 5 (MT5) adalah aplikasi yang dipakai untuk membuka posisi di PU Prime. Bagian yang paling sering dipakai:</p>
<ul><li><b>Quotes / Market Watch</b>: daftar simbol dan harganya. Cari simbol emas (misalnya XAUUSD dengan akhiran sesuai jenis akunmu).</li><li><b>Chart</b>: grafik harga.</li><li><b>Trade</b>: posisi yang sedang terbuka, balance, equity, margin.</li><li><b>History</b>: riwayat transaksi.</li></ul>
<h3>Market order (langsung)</h3>
<p>Posisi dibuka saat itu juga di harga sekarang. Pilih <b>Buy by Market</b> atau <b>Sell by Market</b>.</p>
<h3>Pending order (menunggu harga)</h3>
${fig(FIG.orders(),"Garis hijau di atas harga: Buy Stop (ikut breakout naik) atau Sell Limit (jual di harga lebih tinggi). Garis merah di bawah harga: Buy Limit (beli lebih murah) atau Sell Stop (ikut breakdown).")}
${tbl(["Order","Posisi harga","Kapan dipakai"],[["Buy Limit","Di bawah harga","Ingin BUY saat harga turun ke support"],["Sell Limit","Di atas harga","Ingin SELL saat harga naik ke resistance"],["Buy Stop","Di atas harga","Ingin BUY saat harga menembus ke atas"],["Sell Stop","Di bawah harga","Ingin SELL saat harga menembus ke bawah"]])}
<h3>Cara membuka posisi di MT5 HP</h3>
<ol><li>Buka tab <b>Quotes</b>, ketuk simbol emas, pilih <b>Trade</b>.</li><li>Pilih jenis order (Market atau Pending).</li><li>Isi <b>Volume</b> (lot), contoh 0,01.</li><li>Isi <b>Stop Loss</b> dan <b>Take Profit</b>.</li><li>Ketuk <b>Buy</b> atau <b>Sell</b>.</li></ol>
${box("warn","Jangan pernah membuka posisi tanpa <b>Stop Loss</b>. Satu posisi tanpa SL bisa menghabiskan seluruh akun saat harga bergerak liar.")}`,
quiz:[{q:"Kamu ingin BUY jika harga turun dulu ke support di bawah harga sekarang. Order apa?",o:["Buy Stop","Buy Limit","Sell Limit"],a:1,e:"Buy Limit dipasang di bawah harga sekarang untuk membeli lebih murah."},
{q:"Order untuk SELL saat harga menembus support ke bawah adalah…",o:["Sell Stop","Sell Limit","Buy Limit"],a:0,e:"Sell Stop dipasang di bawah harga untuk mengikuti breakdown."},
{q:"Kolom apa yang wajib diisi untuk membatasi kerugian?",o:["Take Profit","Stop Loss","Comment"],a:1,e:"Stop Loss menutup posisi otomatis saat rugi mencapai batas yang kamu tentukan."}]});

L.push({id:"candle",lvl:"dasar",min:5,t:"Candlestick: membaca satu candle",d:"Open, high, low, close, body, dan sumbu (wick)",
body:()=>`<p>Candlestick adalah cara paling populer menampilkan harga. Satu candle merangkum pergerakan harga dalam satu periode waktu (timeframe), misalnya 5 menit (M5) atau 1 jam (H1).</p>
${fig(anatomySvg(),"Candle hijau (bullish): close lebih tinggi dari open. Candle merah (bearish): close lebih rendah dari open.")}
<h3>Empat harga dalam satu candle</h3>
<ul><li><b>Open</b>: harga pembuka periode.</li><li><b>Close</b>: harga penutup periode.</li><li><b>High</b>: harga tertinggi.</li><li><b>Low</b>: harga terendah.</li></ul>
<h3>Body & wick</h3>
<p><b>Body</b> (badan) adalah jarak open ke close. Body besar berarti salah satu pihak (pembeli atau penjual) sangat dominan. <b>Wick</b> atau sumbu adalah garis tipis di atas dan bawah body.</p>
<p>Wick panjang menunjukkan <b>penolakan harga</b> (rejection). Contohnya, wick bawah panjang berarti harga sempat turun jauh tapi pembeli berhasil mendorongnya naik lagi.</p>
${box("tip","Selalu baca candle setelah <b>close</b>. Candle yang belum selesai bisa berubah bentuk total. Sinyal DirmuFX juga hanya dihitung dari candle yang sudah tutup.")}`,
quiz:[{q:"Candle bullish (hijau) artinya…",o:["Close lebih tinggi dari open","Close lebih rendah dari open","High sama dengan low"],a:0,e:"Bullish = harga ditutup lebih tinggi dari pembukaannya."},
{q:"Wick bawah yang panjang biasanya menunjukkan…",o:["Penjual sangat kuat sampai akhir","Penolakan harga rendah oleh pembeli","Pasar tutup"],a:1,e:"Harga sempat turun jauh lalu didorong naik kembali, tanda pembeli menolak harga rendah."},
{q:"Kapan sebaiknya membaca sinyal dari candle?",o:["Saat candle baru mulai","Setelah candle close","Kapan saja sama"],a:1,e:"Candle yang belum close masih bisa berubah bentuk."}]});

L.push({id:"pola-candle",lvl:"dasar",min:7,t:"Pola candlestick penting",d:"Pin bar, engulfing, doji, inside bar, dan cara memakainya",
body:()=>`<p>Pola candle membantu membaca siapa yang sedang menang: pembeli atau penjual. Tetapi pola <b>tidak berdiri sendiri</b>. Pola baru bermakna jika muncul di lokasi yang tepat, misalnya di area support, resistance, atau searah tren.</p>
<h3>1. Pin bar / Hammer (bullish)</h3>
<p>Body kecil di atas, wick bawah panjang (minimal 2× body). Muncul setelah penurunan atau di support, artinya penjual gagal menekan harga lebih rendah.</p>
${fig(FIG.pinbar(),"Pin bar bullish di support: harga sempat turun jauh, tapi ditutup dekat atas. Setelahnya harga naik.")}
<h3>2. Shooting star (bearish)</h3><p>Kebalikan pin bar bullish: wick atas panjang, body kecil di bawah, muncul di resistance atau setelah kenaikan.</p>
${fig(FIG.star(),"Shooting star di resistance: harga sempat naik tinggi tapi ditolak, lalu turun.")}
<h3>3. Engulfing</h3>
<p><b>Bullish engulfing</b>: candle hijau yang body-nya "menelan" seluruh body candle merah sebelumnya. <b>Bearish engulfing</b>: kebalikannya. Pola ini menunjukkan perubahan kekuatan yang tajam.</p>
${fig(FIG.bullEng(),"Bullish engulfing: candle hijau menelan seluruh body merah sebelumnya, lalu tren berbalik naik.")}
${fig(FIG.bearEng(),"Bearish engulfing di puncak kenaikan: candle merah menelan body hijau sebelumnya.")}
<h3>4. Doji</h3><p>Open dan close hampir sama, body sangat tipis. Artinya pasar ragu-ragu. Doji setelah tren panjang bisa menjadi tanda tren melemah, tapi perlu konfirmasi candle berikutnya.</p>
${fig(FIG.doji(),"Doji di puncak kenaikan: open dan close hampir sama, tanda pasar ragu sebelum turun.")}
<h3>5. Inside bar</h3><p>Candle yang seluruh high-low-nya berada di dalam candle sebelumnya. Menandakan konsolidasi. Trader biasanya menunggu harga menembus high atau low candle induk.</p>
${fig(FIG.inside(),"Inside bar: candle kecil di dalam range candle induk, lalu harga menembus ke atas.")}
${box("tip","Aturan sederhana: <b>lokasi + pola + konfirmasi</b>. Pin bar di tengah-tengah range tanpa area penting biasanya tidak berarti apa-apa.")}`,
quiz:[{q:"Pin bar bullish yang ideal memiliki…",o:["Wick atas panjang","Wick bawah panjang, body kecil di atas","Body besar tanpa wick"],a:1,e:"Wick bawah panjang menunjukkan harga rendah ditolak pembeli."},
{q:"Bullish engulfing adalah…",o:["Candle hijau yang body-nya menelan body merah sebelumnya","Dua doji berturut-turut","Candle merah besar"],a:0,e:"Body hijau menutupi seluruh body merah sebelumnya."},
{q:"Kapan pola candle paling berarti?",o:["Di mana saja","Saat muncul di area penting seperti support/resistance","Hanya di hari Senin"],a:1,e:"Lokasi menentukan kekuatan pola."}]});

L.push({id:"tren",lvl:"dasar",min:6,t:"Tren & struktur pasar",d:"Higher high, lower low, sideways, dan arah utama",
body:()=>`<p>Harga tidak bergerak lurus. Ia naik-turun membentuk gelombang. Dari puncak (high) dan lembah (low) inilah kita membaca <b>struktur pasar</b>.</p>
<h3>Uptrend (tren naik)</h3>
<p>Harga membentuk <b>Higher High (HH)</b> dan <b>Higher Low (HL)</b>: setiap puncak dan lembah lebih tinggi dari sebelumnya. Fokus mencari peluang <b>BUY</b> saat harga koreksi ke HL.</p>
${fig(FIG.up(),"Uptrend H1: setiap puncak (HH) dan lembah (HL) lebih tinggi dari sebelumnya.")}
<h3>Downtrend (tren turun)</h3>
<p>Harga membentuk <b>Lower High (LH)</b> dan <b>Lower Low (LL)</b>. Fokus mencari peluang <b>SELL</b> saat harga naik sementara ke LH.</p>
${fig(FIG.down(),"Downtrend H1: lower high (LH) dan lower low (LL) terus turun.")}
<h3>Sideways (range)</h3>
<p>Harga naik-turun di antara batas atas dan bawah yang relatif sama. Di kondisi ini, entry di tengah range sangat berisiko. Lebih baik menunggu harga di tepi range atau menunggu breakout.</p>
${fig(FIG.range(),"Sideways: harga bolak-balik di antara batas atas dan batas bawah range.")}
<h3>Tren berbeda di tiap timeframe</h3>
<p>H4 bisa uptrend, sementara M5 sedang turun (koreksi). Biasakan melihat arah di timeframe besar dulu, lalu cari entry searah di timeframe kecil. Ini dibahas lebih dalam di bab Multi-timeframe.</p>
${box("tip","<b>Trend is your friend.</b> Untuk pemula, hanya ambil posisi searah tren timeframe besar. Melawan tren (counter-trend) jauh lebih sulit.")}`,
quiz:[{q:"Uptrend ditandai dengan…",o:["Lower high & lower low","Higher high & higher low","High dan low yang sama"],a:1,e:"Puncak dan lembah yang terus lebih tinggi = uptrend."},
{q:"Saat downtrend, peluang yang dicari biasanya…",o:["SELL saat harga naik sementara ke lower high","BUY di setiap candle hijau","Tidak boleh trading"],a:0,e:"Searah tren turun: SELL saat harga koreksi naik."},
{q:"Di pasar sideways, area entry paling berisiko adalah…",o:["Tepi atas range","Tengah range","Tepi bawah range"],a:1,e:"Di tengah range, arah berikutnya tidak jelas dan rasio risk/reward buruk."}]});

L.push({id:"risiko",lvl:"dasar",min:7,t:"Manajemen risiko & ukuran lot",d:"Risiko 1–2%, rumus lot, dan risk/reward",
body:()=>`<p>Trader bertahan lama bukan karena selalu benar, tetapi karena <b>kerugiannya kecil dan terkendali</b>. Manajemen risiko adalah bab paling penting di Akademi ini.</p>
<h3>Aturan 1–2%</h3>
<p>Batasi risiko setiap posisi maksimal <b>1–2% dari saldo</b>. Dengan risiko 2%, kamu butuh 50 kali kalah beruntun untuk kehilangan seluruh modal, sesuatu yang hampir mustahil jika strategimu masuk akal.</p>
<h3>Rumus ukuran lot</h3>
<p><span class="k">lot = risiko ($) ÷ (SL dalam pip × $10)</span></p>
<p><b>Contoh:</b> saldo $500, risiko 1% = $5, SL 30 pip. Lot = 5 ÷ (30 × 10) = 0,0167 → dibulatkan ke bawah menjadi <b>0,01 lot</b> (risiko nyata $3).</p>
${box("note","Dengan saldo kecil (misalnya $30), lot minimum 0,01 dengan SL 30 pip berarti risiko $3 = 10% saldo. Terlalu besar. Solusinya: pakai <b>akun cent</b>, atau perkecil SL dengan entry yang lebih presisi. Kalkulator lot di Signal Room menghitung ini otomatis.")}
<h3>Risk : Reward</h3>
${fig(FIG.rr(),"Contoh posisi BUY dengan rasio 1:3 (alat Long Position di TradingView). Area merah = risiko, area hijau = target.")}
<p>Rasio <b>1:3</b> berarti target untung 3 kali lebih besar dari risiko. Dengan rasio ini, kamu tetap untung walau hanya menang 3 dari 10 posisi:</p>
${tbl(["Hasil 10 posisi","Perhitungan","Total"],[["3 menang, 7 kalah (RR 1:3)","3 × 3R − 7 × 1R","+2R"],["5 menang, 5 kalah (RR 1:1)","5 × 1R − 5 × 1R","0R"]])}
<h3>Batas rugi harian</h3><p>Tentukan batas, misalnya berhenti trading jika rugi <b>3% dalam sehari</b> atau setelah 2 kali SL berturut-turut. Ini melindungimu dari keputusan emosional.</p>`,
quiz:[{q:"Saldo $1.000, risiko 1%, SL 50 pip. Berapa lot?",o:["0,02 lot","0,20 lot","1,00 lot"],a:0,e:"Risiko $10 ÷ (50 × $10) = 0,02 lot."},
{q:"Dengan RR 1:3, berapa winrate minimal agar tidak rugi (impas)?",o:["25%","50%","75%"],a:0,e:"1 menang (+3R) menutupi 3 kalah (−3R). 1 dari 4 = 25%."},
{q:"Risiko yang disarankan per posisi adalah…",o:["10–20% saldo","1–2% saldo","Semua saldo"],a:1,e:"1–2% per posisi menjaga akun tetap bertahan saat kalah beruntun."}]});

L.push({id:"psikologi",lvl:"dasar",min:5,t:"Psikologi trading & kesalahan pemula",d:"Overtrading, revenge trading, dan jurnal trading",
body:()=>`<p>Banyak trader sebenarnya sudah paham teknik, tetapi tetap rugi karena <b>emosi</b>. Kenali kesalahan paling umum berikut agar tidak terjebak.</p>
<h3>Kesalahan yang paling sering</h3>
<ul><li><b>Tidak memakai stop loss</b> dan berharap harga berbalik.</li>
<li><b>Overtrading</b>: membuka terlalu banyak posisi karena bosan atau ingin cepat untung.</li>
<li><b>Revenge trading</b>: langsung membuka posisi lebih besar setelah kena SL untuk "balas dendam".</li>
<li><b>Averaging tanpa rencana</b>: menambah posisi di arah yang salah sehingga kerugian membesar.</li>
<li><b>Lot terlalu besar</b> dibanding saldo.</li>
<li><b>Memindahkan SL menjauh</b> saat harga mendekatinya.</li></ul>
<h3>Kebiasaan trader yang konsisten</h3>
<ul><li>Punya <b>rencana sebelum entry</b>: alasan masuk, lokasi SL, target TP.</li>
<li>Menerima bahwa <b>kalah adalah bagian dari bisnis</b>.</li>
<li>Berhenti setelah mencapai batas rugi harian.</li>
<li>Menulis <b>jurnal trading</b>: tanggal, pair, alasan entry, hasil, dan pelajaran. Evaluasi setiap minggu.</li></ul>
${box("tip","Latih strategimu minimal <b>2–4 minggu di akun demo</b> dengan aturan yang sama persis seperti akun real. Kalau di demo saja belum konsisten, akun real akan lebih berat karena ada tekanan emosi.")}`,
quiz:[{q:"Setelah kena SL, kamu langsung entry lagi dengan lot 2× lebih besar. Ini disebut…",o:["Scalping","Revenge trading","Hedging"],a:1,e:"Mencoba membalas kerugian dengan emosi adalah revenge trading."},
{q:"Kebiasaan apa yang membantu evaluasi strategi?",o:["Menulis jurnal trading","Menghapus riwayat transaksi","Mengganti strategi setiap hari"],a:0,e:"Jurnal membantu melihat pola kesalahan dan kekuatanmu."},
{q:"Harga mendekati SL. Tindakan yang benar adalah…",o:["Menjauhkan SL","Membiarkan SL sesuai rencana","Menambah posisi"],a:1,e:"SL adalah batas rencana. Memindahkannya menjauh hanya memperbesar kerugian."}]});

/* ===== BAB MENENGAH ===== */
L.push({id:"snr",lvl:"menengah",min:7,t:"Support & Resistance yang valid",d:"Cara menarik area SnR dan tanda area itu masih kuat",
body:()=>`<p><b>Support</b> adalah area di bawah harga tempat pembeli berkali-kali menahan penurunan. <b>Resistance</b> adalah area di atas harga tempat penjual berkali-kali menahan kenaikan. Anggap sebagai <b>area (zona)</b>, bukan satu garis tipis.</p>
${fig(FIG.snr(),"Harga memantul beberapa kali di support dan resistance, lalu akhirnya menembus resistance.")}
<h3>Cara menarik SnR</h3>
<ol><li>Mulai dari timeframe besar (H4 atau H1).</li><li>Cari titik balik harga yang <b>tersentuh minimal 2 kali</b>.</li><li>Tarik zona dari ujung wick sampai badan candle di sekitar titik itu.</li><li>Prioritaskan area yang menghasilkan pergerakan kuat (pantulan tajam).</li><li>Tambahkan level psikologis: angka bulat seperti 3800, 3850, 3900.</li></ol>
<h3>Role reversal</h3><p>Resistance yang sudah ditembus dengan kuat sering berubah menjadi <b>support</b> baru, dan sebaliknya. Ini dasar dari strategi breakout–retest.</p>
${fig(FIG.flip(),"Role reversal: resistance yang ditembus berubah menjadi support saat harga kembali (retest).")}
<h3>Tanda SnR melemah</h3><ul><li>Disentuh terlalu sering dalam waktu singkat.</li><li>Pantulan makin kecil setiap kali disentuh.</li><li>Harga menembus dan menutup candle jauh di luar zona.</li></ul>
${box("tip","Jangan entry hanya karena harga menyentuh SnR. Tunggu <b>konfirmasi</b> seperti pin bar atau engulfing di zona tersebut.")}`,
quiz:[{q:"SnR sebaiknya dianggap sebagai…",o:["Satu garis yang presisi","Zona/area","Angka acak"],a:1,e:"Harga jarang memantul tepat di satu angka. Zona lebih realistis."},
{q:"Resistance yang ditembus kuat sering berubah menjadi…",o:["Support","Resistance yang lebih kuat","Tidak berarti apa-apa"],a:0,e:"Ini disebut role reversal."},
{q:"Tanda zona SnR melemah adalah…",o:["Pantulan makin kecil setiap disentuh","Pantulan makin besar","Jarang disentuh"],a:0,e:"Pantulan yang mengecil menunjukkan tekanan dari sisi lawan makin besar."}]});

L.push({id:"snd",lvl:"menengah",min:7,t:"Supply & Demand",d:"Zona asal pergerakan besar: rally-base-drop & drop-base-rally",
body:()=>`<p>Supply & Demand (SnD) melihat dari mana <b>pergerakan besar berasal</b>. Logikanya, di zona itu ada banyak order besar yang belum semua terisi, sehingga saat harga kembali ke sana, reaksi kuat bisa terjadi lagi.</p>
<h3>Pola pembentuk zona</h3>
${tbl(["Pola","Zona","Arah yang dicari"],[["Drop – Base – Rally","Demand","BUY saat kembali ke base"],["Rally – Base – Rally","Demand","BUY (kelanjutan tren)"],["Rally – Base – Drop","Supply","SELL saat kembali ke base"],["Drop – Base – Drop","Supply","SELL (kelanjutan tren)"]])}
${fig(FIG.dbr(),"Drop–Base–Rally: harga turun, berhenti sebentar (base), lalu naik kuat. Saat kembali ke base, harga memantul lagi.")}
${fig(FIG.rbr(),"Rally–Base–Rally: tren naik berhenti sebentar, lalu naik lagi. Base menjadi demand untuk BUY lanjutan.")}
${fig(FIG.rbd(),"Rally–Base–Drop: harga naik, tertahan di base, lalu jatuh. Base menjadi supply untuk SELL.")}
${fig(FIG.dbd(),"Drop–Base–Drop: tren turun berhenti sebentar, lalu turun lagi. Base menjadi supply untuk SELL lanjutan.")}
<h3>Ciri zona yang kuat</h3>
<ul><li>Base pendek (1–3 candle kecil).</li><li>Keluar dari base dengan candle besar dan cepat (impulsif).</li><li><b>Fresh</b>: belum pernah disentuh lagi. Setiap sentuhan mengurangi kekuatannya.</li><li>Searah tren timeframe besar.</li></ul>
<h3>Menarik zona</h3><p>Untuk demand: dari low terendah base sampai body tertinggi base. Untuk supply: dari high tertinggi base sampai body terendah base. SL ditaruh sedikit di luar zona.</p>`,
quiz:[{q:"Drop–Base–Rally membentuk zona…",o:["Supply","Demand","Pivot"],a:1,e:"Harga naik kuat dari base, sehingga base menjadi demand."},
{q:"Zona SnD yang paling kuat biasanya…",o:["Sudah disentuh 5 kali","Masih fresh dan keluar dengan impulsif","Base sangat panjang"],a:1,e:"Zona fresh dengan pergerakan impulsif menyimpan order yang belum terisi."},
{q:"Di mana SL untuk entry BUY di zona demand?",o:["Sedikit di bawah zona","Tepat di tengah zona","Di atas harga entry"],a:0,e:"Jika harga menembus bawah zona, ide BUY dianggap gagal."}]});

L.push({id:"fibo",lvl:"menengah",min:6,t:"Fibonacci retracement & extension",d:"Mengukur area koreksi 38,2–61,8% dan target lanjutan",
body:()=>`<p>Setelah bergerak impulsif, harga biasanya <b>koreksi</b> sebagian sebelum melanjutkan tren. Fibonacci retracement membantu memperkirakan seberapa dalam koreksi itu.</p>
${fig(FIG.fibUp(),"Fibonacci pada uptrend: tarik dari swing low ke swing high. Harga memantul di area 50–61,8%.")}

${fig(FIG.fibDn(),"Fibonacci pada downtrend: tarik dari swing high ke swing low. Harga naik sebentar ke area 38,2–50% lalu turun lagi.")}
<h3>Cara menarik</h3>
<ul><li><b>Uptrend</b>: tarik dari swing <b>low</b> ke swing <b>high</b>.</li><li><b>Downtrend</b>: tarik dari swing <b>high</b> ke swing <b>low</b>.</li></ul>
<h3>Level penting</h3>
${tbl(["Level","Makna"],[["38,2%","Koreksi dangkal, tren sangat kuat"],["50%","Koreksi menengah, sering dipakai"],["61,8%","Golden ratio, area koreksi dalam yang favorit"],["78,6%","Koreksi sangat dalam, tren mulai diragukan"],["127,2% & 161,8%","Extension: target TP saat tren berlanjut"]])}
${box("tip","Fibonacci paling kuat saat bertemu (konfluensi) dengan area lain, misalnya level 61,8% yang berimpit dengan demand atau support lama.")}`,
quiz:[{q:"Pada uptrend, Fibonacci retracement ditarik dari…",o:["Swing high ke swing low","Swing low ke swing high","Candle mana saja"],a:1,e:"Uptrend: dari low ke high, lalu cari koreksi ke bawah."},
{q:"Level yang dijuluki golden ratio adalah…",o:["23,6%","61,8%","100%"],a:1,e:"61,8% adalah rasio emas Fibonacci."},
{q:"Level 161,8% biasanya dipakai sebagai…",o:["Area entry","Target extension/TP","Stop loss"],a:1,e:"Extension memperkirakan target jika tren berlanjut."}]});

L.push({id:"indikator",lvl:"menengah",min:7,t:"Indikator: EMA, RSI, MACD & ATR",d:"Indikator yang dipakai Signal Room DirmuFX dan cara membacanya",
body:()=>`<p>Indikator adalah alat bantu, bukan penentu utama. Signal Room DirmuFX menggabungkan beberapa indikator (konfluensi) dan hanya memberi sinyal saat sebagian besar searah.</p>
<h3>EMA 20, 50 & 200</h3>
<p>Exponential Moving Average menunjukkan rata-rata harga. Jika harga di atas EMA 50 dan EMA 200, dan EMA 20 di atas EMA 50, tren cenderung naik. EMA juga sering menjadi support/resistance dinamis.</p>
${fig(FIG.ema(),"EMA 20 (kuning) di atas EMA 50 (biru) dan harga di atas keduanya: tren naik. Koreksi sering berhenti di sekitar EMA.")}
<h3>RSI 14</h3><p>Mengukur kekuatan gerak. Di atas 70 = <b>overbought</b> (terlalu banyak dibeli), di bawah 30 = <b>oversold</b>. Saat tren kuat, RSI bisa bertahan lama di area ekstrem, jadi jangan otomatis melawan tren. Perhatikan <b>divergence</b>: harga membuat high baru tapi RSI tidak, tanda tenaga melemah.</p>
${fig(FIG.rsi(),"Bearish divergence: harga membuat higher high, tapi RSI membuat puncak lebih rendah. Setelahnya harga turun.")}
<h3>MACD</h3><p>Garis MACD memotong garis sinyal ke atas = momentum naik. Histogram yang membesar menunjukkan momentum menguat.</p>
${fig(FIG.macd(),"MACD (biru) memotong garis sinyal (oranye) ke atas dan histogram berubah hijau saat harga mulai naik.")}
<h3>ATR 14</h3><p>Average True Range mengukur rata-rata jarak gerak per candle. DirmuFX memakai <b>1,5 × ATR</b> untuk jarak stop loss, sehingga SL menyesuaikan kondisi pasar: lebar saat volatil, sempit saat tenang.</p>
${box("note","Terlalu banyak indikator justru membingungkan. Pilih 2–3 yang saling melengkapi: satu untuk tren (EMA), satu untuk momentum (RSI/MACD), satu untuk volatilitas (ATR).")}`,
quiz:[{q:"RSI di atas 70 artinya…",o:["Oversold","Overbought","Pasar tutup"],a:1,e:"Di atas 70 = overbought, di bawah 30 = oversold."},
{q:"ATR dipakai DirmuFX untuk…",o:["Menentukan jarak stop loss","Menentukan jam trading","Menghitung spread"],a:0,e:"SL = 1,5 × ATR agar menyesuaikan volatilitas."},
{q:"Bearish divergence pada RSI terjadi saat…",o:["Harga membuat high baru, RSI tidak","Harga dan RSI sama-sama naik","RSI di 50"],a:0,e:"Harga naik tapi tenaganya (RSI) melemah."}]});

L.push({id:"mtf",lvl:"menengah",min:6,t:"Analisa multi-timeframe",d:"Arah dari H4/H1, area dari H1/M15, entry dari M5",
body:()=>`<p>Multi-timeframe analysis (MTF) berarti melihat beberapa timeframe secara berurutan dari besar ke kecil. Tujuannya agar entry di timeframe kecil <b>searah</b> dengan arus besar.</p>
${tbl(["Langkah","Timeframe","Yang dicari"],[["1. Arah (bias)","H4 / H1","Tren naik, turun, atau range"],["2. Area","H1 / M15","Zona SnR, SnD, atau Fibonacci"],["3. Entry","M5 / M1","Pola konfirmasi: pin bar, engulfing, BOS kecil"]])}
<h3>Contoh alur BUY</h3>
${fig(FIG.h4(),"Langkah 1, H4: struktur naik dan harga di atas EMA 50, jadi bias BUY.")}
${fig(FIG.h1(),"Langkah 2, H1: harga koreksi ke zona demand.")}
${fig(FIG.m5(),"Langkah 3, M5: bullish engulfing di zona demand menjadi entry BUY.")}

<ol><li>H4: struktur HH-HL, harga di atas EMA 200 → <b>bias BUY</b>.</li><li>H1: harga koreksi ke demand yang berimpit dengan Fibonacci 50–61,8%.</li><li>M5: muncul bullish engulfing di zona tersebut → <b>entry BUY</b>, SL di bawah zona.</li></ol>
${box("tip","Panel <b>Multi-timeframe</b> di Signal Room menampilkan arah M1 sampai D1 sekaligus. Peluang terbaik muncul saat sebagian besar timeframe searah.")}
${box("warn","Jangan memaksa entry jika timeframe besar dan kecil bertentangan. Menunggu juga keputusan trading.")}`,
quiz:[{q:"Timeframe untuk menentukan arah utama sebaiknya…",o:["M1","H4/H1","Tick"],a:1,e:"Arah utama dilihat dari timeframe besar."},
{q:"Urutan analisa yang benar adalah…",o:["Entry → Area → Arah","Arah → Area → Entry","Acak"],a:1,e:"Mulai dari besar ke kecil: arah, area, lalu entry."},
{q:"H4 downtrend, M5 muncul sinyal BUY. Untuk pemula sebaiknya…",o:["Ambil BUY dengan lot besar","Lewati atau tunggu sinyal SELL searah H4","Buka BUY dan SELL bersamaan"],a:1,e:"Entry melawan tren besar lebih berisiko."}]});

L.push({id:"sinyal-dirmufx",lvl:"menengah",min:6,t:"Cara memakai sinyal DirmuFX",d:"Membaca Signal Room, SL+, TP1, TP MAX & ukuran lot",
body:()=>`<p>Signal Room DirmuFX menghitung sinyal dari konfluensi indikator di candle yang sudah tutup, disaring dengan arah timeframe lebih besar. Bab ini menjelaskan cara memakainya dengan disiplin.</p>
<h3>Arti status</h3>
${tbl(["Status","Artinya","Tindakan"],[["BUY / SELL","Sinyal aktif terkunci","Pertimbangkan entry di sekitar harga entry"],["TUNGGU","Belum ada sinyal","Jangan entry. Level yang tampil hanya rencana"],["Kekuatan %","Seberapa banyak indikator searah","Makin tinggi makin meyakinkan"]])}
<h3>Manajemen posisi (RR 1:3)</h3>
${fig(FIG.rr(),"Level sinyal DirmuFX pada chart: Entry, Stop loss, SL+ (1:1), TP1 (1:2), dan TP MAX (1:3).")}
<ol><li><b>Entry</b> di sekitar harga yang tertera. Kalau harga sudah lari jauh, lebih baik lewati.</li><li>Pasang <b>Stop loss</b> sesuai kartu sejak awal.</li><li>Saat harga mencapai <b>SL+ (1:1)</b>, geser SL ke harga entry. Sejak titik ini posisimu bebas risiko.</li><li>Di <b>TP1 (1:2)</b>, ambil sebagian untung (misalnya tutup 50%).</li><li>Sisanya biarkan berjalan ke <b>TP MAX (1:3)</b>.</li></ol>
<h3>Ukuran lot</h3><p>Isi <b>Saldo</b> dan <b>Risiko %</b> di kalkulator kartu sinyal. Lot dihitung otomatis dari jarak SL. Jangan menaikkan lot di luar hitungan kalkulator.</p>
${box("warn","Sinyal bukan jaminan. Akan ada sinyal yang kena SL. Dengan RR 1:3 dan risiko kecil per posisi, beberapa kekalahan tetap bisa tertutup oleh satu kemenangan.")}
${box("note","Harga di Signal Room bisa sedikit berbeda dengan harga broker. Selalu cocokkan dengan harga di MT5 PU Prime sebelum entry.")}`,
quiz:[{q:"Status TUNGGU berarti…",o:["Entry sekarang","Belum ada sinyal aktif, jangan entry","Tutup semua posisi"],a:1,e:"Level saat TUNGGU hanya rencana jika sinyal terkonfirmasi."},
{q:"Saat harga mencapai SL+ (1:1), yang dilakukan adalah…",o:["Menambah lot","Menggeser SL ke harga entry","Menghapus TP"],a:1,e:"Posisi menjadi bebas risiko (break even)."},
{q:"Di TP1 (1:2), langkah yang disarankan…",o:["Tutup sebagian posisi","Buka posisi berlawanan","Pindahkan SL lebih jauh"],a:0,e:"Ambil sebagian untung, sisanya ke TP MAX."}]});

/* ===== BAB LANJUTAN ===== */
L.push({id:"breakout",lvl:"lanjutan",min:6,t:"Breakout, retest & false breakout",d:"Membedakan tembusan asli dan jebakan",
body:()=>`<p>Breakout terjadi saat harga keluar dari range, support, atau resistance. Masalahnya, banyak breakout ternyata <b>palsu</b> (false breakout) dan harga kembali masuk ke range.</p>
${fig(FIG.brk(),"Breakout ditutup kuat di atas resistance, lalu harga kembali menguji zona itu (retest) sebelum naik.")}
<h3>Ciri breakout yang valid</h3><ul><li>Candle <b>close</b> jelas di luar zona, bukan hanya wick.</li><li>Candle breakout besar dan impulsif.</li><li>Searah tren timeframe besar.</li><li>Terjadi di sesi aktif (London atau New York).</li></ul>
<h3>Strategi retest</h3><p>Daripada mengejar candle breakout, tunggu harga kembali menguji zona yang ditembus (retest). Entry saat muncul konfirmasi di zona itu. SL di sisi lain zona.</p>
<h3>False breakout</h3><p>Harga menembus sebentar lalu menutup kembali di dalam range, sering dengan wick panjang. Ini biasanya terjadi karena harga "mengambil" stop loss trader lain (liquidity). False breakout bisa menjadi peluang ke arah sebaliknya.</p>
${fig(FIG.fake(),"False breakout: harga menembus resistance sebentar dengan wick panjang, lalu ditutup kembali di bawah dan turun.")}`,
quiz:[{q:"Breakout yang lebih valid ditandai dengan…",o:["Hanya wick yang keluar zona","Candle close jelas di luar zona","Terjadi di jam sepi"],a:1,e:"Close di luar zona menunjukkan penerimaan harga baru."},
{q:"Strategi retest berarti…",o:["Mengejar candle breakout","Menunggu harga kembali menguji zona yang ditembus","Entry di tengah range"],a:1,e:"Retest memberi entry lebih baik dengan SL lebih jelas."},
{q:"False breakout sering ditandai dengan…",o:["Wick panjang lalu close kembali di dalam range","Tiga candle besar searah","Volume nol"],a:0,e:"Harga menembus sebentar lalu ditolak kembali."}]});

L.push({id:"smc",lvl:"lanjutan",min:8,t:"Smart Money Concepts (SMC)",d:"BOS, CHoCH, order block, dan fair value gap",
body:()=>`<p>Smart Money Concepts membaca jejak pelaku besar (institusi) lewat struktur harga. Istilahnya terdengar rumit, tetapi dasarnya tetap struktur pasar yang sudah kamu pelajari.</p>
<h3>BOS & CHoCH</h3>
<ul><li><b>BOS (Break of Structure)</b>: harga menembus high terakhir di uptrend (atau low terakhir di downtrend). Tanda tren <b>berlanjut</b>.</li><li><b>CHoCH (Change of Character)</b>: tembusan pertama <b>berlawanan</b> arah tren. Tanda awal tren bisa berubah.</li></ul>
${fig(FIG.choch(),"Downtrend (LH–LL), lalu harga menembus lower high terakhir (CHoCH) dan berlanjut dengan BOS ke atas.")}
<h3>Order Block (OB)</h3><p>Candle berlawanan terakhir sebelum pergerakan impulsif yang menghasilkan BOS. Contoh bullish OB: candle merah terakhir sebelum harga naik tajam. Saat harga kembali ke OB, sering terjadi reaksi.</p>
${fig(FIG.ob(),"Bullish order block: candle merah terakhir sebelum kenaikan impulsif. Saat harga kembali ke zona ini, harga memantul.")}
<h3>Fair Value Gap (FVG)</h3>
<p>Celah dalam 3 candle impulsif: area antara <b>high candle pertama</b> dan <b>low candle ketiga</b> (untuk gerak naik) yang tidak tersentuh. Harga sering kembali "mengisi" celah ini sebelum melanjutkan.</p>
${fig(FIG.fvg(),"Tiga candle impulsif meninggalkan celah (fair value gap). Harga kembali mengisi celah lalu naik.")}
${box("tip","Kombinasi favorit: bias dari BOS di H1, entry saat harga kembali ke OB atau FVG di M5/M15, SL di luar OB. Indikator DirmuFX SMC di TradingView menandai area ini otomatis.")}`,
quiz:[{q:"CHoCH adalah…",o:["Tembusan searah tren","Tembusan pertama berlawanan arah tren","Candle doji"],a:1,e:"Change of Character menandai kemungkinan perubahan tren."},
{q:"Bullish order block adalah…",o:["Candle merah terakhir sebelum kenaikan impulsif","Candle hijau terbesar","Area di atas resistance"],a:0,e:"OB = candle berlawanan terakhir sebelum gerak impulsif."},
{q:"FVG pada gerak naik berada di antara…",o:["High candle 1 dan low candle 3","Open dan close candle 2","High dan low hari kemarin"],a:0,e:"Celah yang tidak tersentuh di antara candle 1 dan 3."}]});

L.push({id:"likuiditas",lvl:"lanjutan",min:7,t:"Likuiditas & setup scalping per sesi",d:"Range Asia, liquidity sweep, PDH/PDL, dan setup M5",
body:()=>`<p><b>Likuiditas</b> adalah kumpulan order, terutama stop loss trader lain, yang menumpuk di atas high dan di bawah low yang jelas. Harga sering "menyapu" area ini (liquidity sweep) sebelum bergerak ke arah sebenarnya.</p>
<h3>Area likuiditas yang perlu ditandai setiap hari</h3>
<ul><li><b>High & low sesi Asia</b> (± 07.00–15.00 WITA).</li><li><b>PDH & PDL</b>: high dan low hari sebelumnya.</li><li>Equal highs / equal lows: dua puncak atau lembah yang hampir sama.</li><li>Level angka bulat (3800, 3850, 3900).</li></ul>
${fig(FIG.asia(),"Awal sesi London menyapu high Asia (sweep), lalu harga berbalik turun menembus low Asia.")}

${fig(FIG.pdh(),"Equal highs dan PDH (high kemarin) menjadi tumpukan stop loss. Harga menyapunya lalu turun tajam.")}
<h3>Contoh setup scalping M5 (sesi London)</h3>
<ol><li>Tandai high dan low Asia.</li><li>Tunggu harga menyapu salah satu sisi di awal London (16.00–18.00 WITA).</li><li>Tunggu CHoCH di M5 ke arah berlawanan dari sapuan.</li><li>Entry saat harga kembali ke OB/FVG M5, SL di atas/bawah ujung sapuan.</li><li>Target: sisi lain range Asia atau RR 1:3.</li></ol>
${box("warn","Scalping butuh disiplin tinggi dan spread rendah. Batasi maksimal 2–3 posisi per sesi dan hentikan setelah mencapai batas rugi harian.")}`,
quiz:[{q:"Liquidity sweep adalah…",o:["Harga menyapu area stop loss di atas high/bawah low sebelum berbalik","Pasar tutup","Spread nol"],a:0,e:"Harga mengambil likuiditas di level yang jelas lalu bergerak ke arah sebenarnya."},
{q:"PDH adalah…",o:["Previous Day High","Price Daily Hedge","Pending Daily Hold"],a:0,e:"High hari sebelumnya, area likuiditas penting."},
{q:"Setelah sweep high Asia, konfirmasi yang ditunggu untuk SELL adalah…",o:["CHoCH turun di M5","Candle hijau besar","RSI 50"],a:0,e:"CHoCH ke bawah menunjukkan sweep diikuti perubahan arah."}]});

L.push({id:"fundamental",lvl:"lanjutan",min:8,t:"Fundamental emas & trading saat berita",d:"DXY, yield, The Fed, CPI, NFP, dan geopolitik",
body:()=>`<p>Teknikal menjelaskan <b>di mana</b> masuk, fundamental menjelaskan <b>kenapa</b> harga bergerak besar. Emas sangat sensitif terhadap kondisi dolar Amerika dan suku bunga.</p>
<h3>Hubungan utama</h3>
${tbl(["Faktor","Jika naik/menguat","Dampak umum ke emas"],[["Dolar AS (DXY)","Dolar menguat","Cenderung turun"],["Yield obligasi AS (US10Y)","Yield naik","Cenderung turun"],["Suku bunga The Fed","Naik / sikap hawkish","Cenderung turun"],["Ketegangan geopolitik","Meningkat","Cenderung naik (safe haven)"],["Inflasi","Naik tinggi","Bisa naik, tapi tergantung respons The Fed"]])}
<p>Ini hubungan umum, bukan hukum pasti. Kadang emas dan dolar naik bersamaan, misalnya saat terjadi krisis besar.</p>
<h3>Berita yang paling menggerakkan emas</h3>
<ul><li><b>FOMC</b>: keputusan suku bunga dan konferensi pers The Fed (sekitar 02.00–03.00 WITA).</li><li><b>CPI</b>: data inflasi Amerika (20.30–21.30 WITA).</li><li><b>NFP</b>: data tenaga kerja, Jumat pertama setiap bulan (20.30–21.30 WITA).</li><li>PPI, Retail Sales, PCE, klaim pengangguran mingguan.</li></ul>
<h3>Cara membaca hasil data</h3><p>Bandingkan <b>Actual</b> dengan <b>Forecast</b>. Contoh: CPI lebih tinggi dari perkiraan → pasar menduga The Fed tetap ketat → dolar menguat → emas cenderung turun. Tab Kalender di Signal Room menampilkan forecast dan previous.</p>
${fig(FIG.news(),"Contoh reaksi emas saat rilis CPI 21:30 WITA: satu candle M5 bisa bergerak puluhan pip dengan wick panjang di dua arah.")}
<h3>Aturan saat berita</h3>
<ol><li>Cek kalender setiap pagi.</li><li>Tutup atau amankan posisi (SL+) sebelum berita berdampak tinggi.</li><li>Jangan entry 15 menit sebelum sampai 15 menit setelah rilis.</li><li>Biarkan candle pertama setelah berita selesai, lalu baca arah yang dipilih pasar.</li></ol>`,
quiz:[{q:"Jika dolar (DXY) menguat tajam, emas biasanya…",o:["Cenderung turun","Cenderung naik","Tidak terpengaruh"],a:0,e:"Emas dihargai dalam dolar. Dolar kuat membuat emas lebih mahal bagi pembeli lain."},
{q:"CPI Amerika keluar jauh di atas forecast. Reaksi umum emas…",o:["Cenderung turun karena dolar menguat","Pasti naik","Pasar tutup"],a:0,e:"Inflasi tinggi → ekspektasi suku bunga ketat → dolar menguat."},
{q:"Kenapa emas sering naik saat ketegangan geopolitik?",o:["Dianggap aset aman (safe haven)","Karena spread turun","Karena pasar tutup"],a:0,e:"Investor mencari perlindungan nilai saat ketidakpastian."}]});

L.push({id:"trading-plan",lvl:"lanjutan",min:6,t:"Menyusun trading plan & evaluasi",d:"Aturan pribadi, checklist entry, dan cara mengevaluasi hasil",
body:()=>`<p>Trading plan adalah aturan tertulis yang kamu ikuti setiap hari. Tanpa rencana, keputusanmu akan dikendalikan emosi.</p>
<h3>Isi trading plan</h3>
<ul><li><b>Pasar & sesi</b>: misalnya hanya XAUUSD, sesi London dan New York.</li><li><b>Strategi</b>: setup apa yang boleh diambil (contoh: sweep Asia + CHoCH M5, atau sinyal DirmuFX searah H1).</li><li><b>Risiko</b>: 1% per posisi, maksimal 3% rugi per hari, maksimal 3 posisi per hari.</li><li><b>Manajemen posisi</b>: SL+ di 1:1, TP1 di 1:2, TP MAX di 1:3.</li><li><b>Kapan tidak trading</b>: 15 menit sekitar berita besar, saat lelah, atau setelah mencapai batas rugi.</li></ul>
<h3>Checklist sebelum entry</h3>
<ol><li>Arah timeframe besar sudah jelas?</li><li>Harga berada di area penting (SnR, SnD, OB, Fibonacci)?</li><li>Ada konfirmasi di timeframe kecil?</li><li>Tidak ada berita besar dalam 30 menit?</li><li>Lot sesuai kalkulator dan SL sudah dipasang?</li></ol>
<h3>Evaluasi mingguan</h3>
<p>Dari jurnal, hitung: jumlah posisi, <b>winrate</b>, rata-rata <b>RR</b>, total R, dan kesalahan yang paling sering. Ubah satu hal saja setiap kali evaluasi, lalu uji minimal 20–30 posisi sebelum menilai hasilnya.</p>
${box("tip","Ukur hasil dalam <b>R</b> (kelipatan risiko), bukan dolar. +6R dalam sebulan dengan risiko 1% berarti sekitar +6% saldo, dan angka ini bisa dibandingkan meski ukuran akun berubah.")}`,
quiz:[{q:"Apa fungsi utama trading plan?",o:["Mengurangi keputusan emosional dengan aturan tertulis","Menjamin profit","Mengganti stop loss"],a:0,e:"Aturan tertulis membuat keputusan lebih konsisten."},
{q:"Berapa posisi minimal sebelum menilai perubahan strategi?",o:["1–2 posisi","20–30 posisi","Tidak perlu diuji"],a:1,e:"Hasil beberapa posisi saja belum bisa mewakili."},
{q:"Kenapa hasil sebaiknya diukur dalam R?",o:["Bisa dibandingkan walau ukuran akun berubah","Agar terlihat lebih besar","Karena broker memintanya"],a:0,e:"R mengukur hasil relatif terhadap risiko."}]});

 menengah:{n:"Menengah",d:"Menentukan area entry & konfirmasi yang valid.",free:true},
 lanjutan:{n:"Lanjutan",d:"Scalping, Smart Money Concepts & fundamental emas.",free:true}};

let acc=ON?"loading":"guest";

const setDone=id=>{try{const d=done();d[id]=1;localStorage.setItem("dfx-learn",JSON.stringify(d))}catch(e){}};

const LOCK='<svg class="ic lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';

function list(){
 const d=done(),n=L.length,nd=L.filter(l=>d[l.id]).length;
 let h=`<section class="hero"><span class="eyb">Akademi DirmuFX</span><h1>Belajar trading emas dari nol</h1>
 <p class="lead">Kurikulum bertahap khusus XAUUSD: mulai dari istilah dasar, candlestick, dan manajemen risiko, sampai Smart Money Concepts dan fundamental. Setiap bab ada gambar dan kuis singkat.</p>
 <div class="stats"><span>${n} bab</span><span>${n} kuis</span><span>${nd} selesai</span><span>Semua bab gratis</span></div></section>`;
 for(const k in LV){const ls=L.filter(l=>l.lvl===k);
  h+=`<section class="lvl"><div class="lvh"><div><h2>${LV[k].n}</h2><p>${LV[k].d}</p></div><span class="tag ${LV[k].free?"free":"vip"}">${LV[k].free?"Gratis":"VIP"}</span></div>`;
  ls.forEach(l=>{const i=L.indexOf(l)+1;h+=`<a class="card ${d[l.id]?"done":""}" href="#b/${l.id}"><span class="num">${d[l.id]?"✓":i}</span><span class="mt"><h3>${l.t}</h3><p>${l.d} · ${l.min} menit</p></span>${canRead(l)?ARR:LOCK}</a>`});
  h+=`</section>`}
 h+=`<p class="disc">⚠️ Trading emas/forex dengan leverage berisiko tinggi dan bisa menghabiskan modal. Materi ini untuk edukasi, bukan ajakan atau jaminan profit.</p>`;
 $("main").innerHTML=h;
}
function lesson(id){
 const l=L.find(x=>x.id===id);if(!l){location.hash="";return}
 const i=L.indexOf(l),pv=L[i-1],nx=L[i+1],lv=LV[l.lvl];
 let h=`<div class="crumb"><a href="#">Akademi</a><span>›</span><span>${lv.n}</span></div>
 <h1 class="lt">${l.t}</h1><div class="meta"><span class="pill ${lv.free?"ok":""}">${lv.free?"Gratis":"VIP"}</span><span>Bab ${i+1} dari ${L.length}</span><span>· ${l.min} menit baca</span></div>`;
 const body=l.body();
 if(canRead(l)){
  h+=`<article class="body">${body}</article>`+quiz(l);
 }else{
  const first=(body.match(/<p>[\s\S]*?<\/p>/)||[""])[0];
  h+=`<div class="lockc"><div class="body fade">${first}</div></div>`;
  if(acc==="loading")h+=`<div class="lockcard"><p style="margin:0">Memeriksa akses member…</p></div>`;
  else h+=`<div class="lockcard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
   <h3>Bab ${lv.n} khusus member VIP</h3><p>${acc==="guest"?"Daftar gratis, lalu aktifkan VIP lewat broker partner (deposit min $30) atau VIP seumur hidup.":"Akunmu belum aktif. Selesaikan langkah aktivasi VIP untuk membuka semua bab Menengah & Lanjutan."}</p>
   <div class="row">${acc==="guest"?`<a class="btn gold" href="index.html#daftar">Daftar gratis</a><a class="btn" href="index.html#masuk">Masuk</a>`:`<a class="btn gold" href="index.html#aktivasi">Aktifkan VIP</a>`}</div></div>`;
 }
 h+=`<nav class="nav2">${pv?`<a href="#b/${pv.id}"><span>← Sebelumnya</span>${pv.t}</a>`:"<span></span>"}${nx?`<a class="r" href="#b/${nx.id}"><span>Berikutnya →</span>${nx.t}</a>`:`<a class="r" href="#"><span>Selesai</span>Kembali ke daftar bab</a>`}</nav>
 <p class="disc">⚠️ Materi edukasi, bukan saran keuangan. Latih dulu di akun demo sebelum memakai dana real.</p>`;
 $("main").innerHTML=h;
 const qs=document.querySelectorAll(".qq");let answered=0,right=0;
 qs.forEach((q,qi)=>q.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
  const a=+q.dataset.a,pick=+b.dataset.i,ok=pick===a;
  q.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(+x.dataset.i===a)x.classList.add("right")});
  if(!ok)b.classList.add("wrong");
  const e=q.querySelector(".exp");e.hidden=false;e.className="exp"+(ok?"":" bad");e.innerHTML=(ok?"✓ Benar. ":"✗ Belum tepat. ")+l.quiz[qi].e;
  answered++;if(ok)right++;

 }));
}
function quiz(l){
 if(!l.quiz||!l.quiz.length)return "";
 return `<section class="quiz"><h3>Kuis singkat</h3><p class="lead" style="font-size:14px">Jawab ${l.quiz.length} soal untuk mengecek pemahamanmu.</p>`+
  l.quiz.map((q,qi)=>`<div class="qq" data-a="${q.a}"><div class="q">${qi+1}. ${q.q}</div>${q.o.map((o,oi)=>`<button class="opt" type="button" data-i="${oi}">${o}</button>`).join("")}<div class="exp" hidden></div></div>`).join("")+
  `<div class="score" id="score"></div></section>`;
}

 if(acc==="active"){p.className="pill ok";p.textContent="VIP aktif";p.href="index.html#akun"}
 else if(acc==="pending"){p.className="pill";p.textContent="Aktifkan VIP";p.href="index.html#aktivasi"}

 else{p.className="pill";p.textContent="Masuk";p.href="index.html#masuk"}}
