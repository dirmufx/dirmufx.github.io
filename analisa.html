<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Analisa Harian DirmuFX · Forex, Emas & Crypto</title>
<meta name="description" content="Analisa harian DirmuFX untuk emas (XAUUSD), forex, dan crypto: bias, level support & resistance, dan skenario trading.">
<script src="dfx-config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#141714;--bg2:#181c18;--panel:#1c201c;--panel2:#242924;--line:#2c322c;--fg:#eef0e8;--muted:#a6ad9f;--gold:#5b9cf5;--gold-hi:#8dbbff;--gold-lo:#3f80dc;--up:#66cf92;--up-dim:#163a27;--down:#e86a64;
 --f-display:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--f-body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--f-mono:"Plus Jakarta Sans",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:radial-gradient(900px 500px at 90% -10%,rgba(91,156,245,.10),transparent 60%),var(--bg);font-feature-settings:"tnum" 1;color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.65;min-height:100vh}
a{color:var(--gold)}
.top{position:sticky;top:0;z-index:20;background:rgba(10,10,12,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-left,0px))}
.back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--fg);font-weight:600;font-size:14px;border:1px solid var(--line);border-radius:12px;padding:7px 12px;background:var(--panel)}
.brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0;text-decoration:none;color:var(--fg)}
.brand svg{width:26px;height:auto;flex:none}
.brand b{font-family:var(--f-display);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:430px){.back span{display:none}.back{padding:7px 9px}}
.brand b i{font-style:normal;color:#63d297}
.pill{font-family:var(--f-display);font-size:11px;font-weight:700;letter-spacing:.06em;border-radius:99px;padding:4px 10px;border:1px solid #2a4670;color:var(--gold);background:#121c2b;text-decoration:none;white-space:nowrap}
.pill.ok{border-color:#1d5c46;color:var(--up);background:var(--up-dim)}
.wrap{max-width:760px;margin:0 auto;padding:22px max(16px,env(safe-area-inset-left,0px)) 80px}
.hero h1{font-family:var(--f-display);font-size:30px;line-height:1.15;margin:6px 0 10px}
.hero h1 em{font-style:normal;color:var(--gold)}
.eyb{font-family:var(--f-display);font-size:12px;font-weight:700;letter-spacing:.22em;color:var(--up)}
.lead{color:var(--muted);margin:0}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.stats span{font-size:13px;border:1px solid var(--line);border-radius:99px;padding:5px 12px;background:var(--panel);color:#c9c3b6}
.lvl{margin-top:30px}
.lvh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.lvh h2{font-family:var(--f-display);font-size:20px;margin:0}
.lvh .tag{font-family:var(--f-display);font-size:11px;font-weight:700;letter-spacing:.08em;border-radius:99px;padding:3px 10px}
.tag.free{background:var(--up);color:#06261b}.tag.vip{background:var(--gold);color:#fff}
.lvh p{margin:0;color:var(--muted);font-size:13.5px}
.card{display:flex;gap:14px;align-items:center;text-decoration:none;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:8px}
.card:active{background:var(--panel2)}
.num{width:38px;height:38px;border-radius:12px;flex:none;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;background:var(--panel2);border:1px solid var(--line);color:var(--gold)}
.card.done .num{background:var(--up-dim);color:var(--up);border-color:#1d5c46}
.card h3{margin:0;font-size:15.5px;line-height:1.35}
.card p{margin:2px 0 0;font-size:13px;color:var(--muted);line-height:1.45}
.card .mt{flex:1;min-width:0}
.card .ic{flex:none;color:var(--muted);width:18px;height:18px}
.card .ic.lock{color:var(--gold)}
/* lesson */
.crumb{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.crumb a{color:var(--muted);text-decoration:none}
.lt{font-family:var(--f-display);font-size:27px;line-height:1.2;margin:8px 0 6px}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted);margin-bottom:18px}
.body h3{font-family:var(--f-display);font-size:19px;margin:26px 0 8px;color:var(--fg)}
.body p{margin:0 0 12px;color:#dcd7cc}
.body ul,.body ol{margin:0 0 14px;padding-left:22px;color:#dcd7cc}
.body li{margin:4px 0}
.body b{color:var(--fg)}
.body .k{font-family:var(--f-mono);font-size:14px;color:var(--gold-hi);background:#121c2b;border-radius:6px;padding:1px 6px}
.fig{margin:16px 0 18px;background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:10px;overflow:hidden}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:12.5px;color:var(--muted);padding:8px 4px 2px;line-height:1.45}
.box{border-radius:14px;padding:12px 14px;margin:14px 0;font-size:14.5px;line-height:1.55}
.box.tip{background:var(--up-dim);border:1px solid #1d5c46;color:#cdeee0}
.box.warn{background:#2a1418;border:1px solid #5a2530;color:#f3c9cf}
.box.note{background:#121c2b;border:1px solid #2a4670;color:#cfe0ff}
.box b{color:inherit}
.tbl{width:100%;border-collapse:collapse;margin:8px 0 16px;font-size:14px}
.tblw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl th,.tbl td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-family:var(--f-display);font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:600}
.tbl td{color:#dcd7cc}
/* quiz */
.quiz{margin-top:28px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}
.quiz h3{font-family:var(--f-display);font-size:18px;margin:0 0 4px}
.qq{margin-top:18px}
.qq .q{font-weight:600;margin-bottom:8px}
.opt{display:block;width:100%;text-align:left;font:inherit;font-size:15px;color:var(--fg);background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-top:7px;cursor:pointer}
.opt.right{border-color:var(--up);background:var(--up-dim)}
.opt.wrong{border-color:var(--down);background:#2a1418}
.opt:disabled{cursor:default}
.exp{font-size:14px;margin-top:8px;color:#cdeee0}
.exp.bad{color:#f3c9cf}
.score{margin-top:16px;font-weight:700;font-family:var(--f-display)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-weight:700;font-size:15px;border-radius:14px;padding:12px 16px;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--fg);text-decoration:none}
.btn.gold{background:var(--up);color:#06261b;border:0}
.btn.green{background:var(--up);color:#06261b;border:0}
.nav2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
.nav2 a{display:block;text-decoration:none;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;font-size:13px}
.nav2 a span{display:block;color:var(--muted);font-size:12px}
.nav2 a.r{text-align:right}
.lockc{position:relative;margin-top:6px}
.lockc .fade{max-height:170px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 30%,transparent);mask-image:linear-gradient(#000 30%,transparent)}
.lockcard{background:linear-gradient(160deg,#0f1a2a,#131316 70%);border:1px solid #2a4670;border-radius:18px;padding:20px;text-align:center}
.lockcard svg{width:36px;height:36px;color:var(--gold)}
.lockcard h3{font-family:var(--f-display);font-size:19px;margin:8px 0 6px}
.lockcard p{color:var(--muted);margin:0 0 14px;font-size:14px}
.lockcard .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.disc{font-size:12px;color:var(--muted);text-align:center;margin-top:30px}
*{letter-spacing:normal!important;text-transform:none!important}
.hero h1,.lt,.lvh h2{letter-spacing:-.02em!important;font-weight:800}
.eyb{font-size:14px;font-weight:600}
.btn,.back{border-radius:999px}
.card{border-color:transparent}
.pill{font-size:12px}
</style>
<style>
.chips{display:flex;gap:8px;overflow-x:auto;margin:16px 0 4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;font:inherit;font-size:14px;font-weight:600;border:0;border-radius:999px;padding:8px 14px;background:var(--panel);color:var(--muted);cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--fg);color:#141714}
.day{margin-top:24px;font-weight:700;font-size:15px;color:var(--muted)}
.an{background:var(--panel);border-radius:18px;padding:16px;margin-top:10px}
.an .anh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.an .mk{font-weight:800;font-size:17px}
.bias{font-size:12.5px;font-weight:700;border-radius:999px;padding:3px 10px}
.bias.bullish{background:var(--up-dim);color:var(--up)}.bias.bearish{background:#3a1c1b;color:var(--down)}.bias.netral{background:#14233a;color:var(--gold)}
.an .tf{font-size:12.5px;color:var(--muted)}
.an h3{font-size:17px;margin:10px 0 6px;line-height:1.35}
.an p{margin:0;color:#dcd7cc;font-size:15px;white-space:pre-line}
.lv2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.lv2 div{background:var(--bg2);border-radius:12px;padding:10px 12px}
.lv2 span{display:block;font-size:12.5px;color:var(--muted)}.lv2 b{font-size:15px}
.lv2 .r b{color:var(--down)}.lv2 .s b{color:var(--up)}
.vip{margin-top:12px;border-radius:14px;padding:12px 14px;background:#121c2b;font-size:15px;white-space:pre-line;color:#dbe7ff}
.vip.lock{display:flex;align-items:center;justify-content:space-between;gap:10px;white-space:normal;color:var(--muted);font-size:14px}
.vip .btn{padding:9px 14px;font-size:14px;flex:none}
.empty{background:var(--panel);border-radius:18px;padding:22px;text-align:center;color:var(--muted);margin-top:16px}
</style>
</head>
<body>
<header class="top"><div class="in">
 <a class="back" href="index.html#top" aria-label="Kembali ke beranda DirmuFX"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg><span>Beranda</span></a>
 <a class="brand" href="#"><svg viewBox="0 0 314 343" aria-hidden="true"><path d="M15 15H140A156.5 156.5 0 0 1 140 328H15Z" fill="none" stroke="#63d297" stroke-width="30" stroke-linejoin="round"/><g fill="#fff"><rect x="87" y="159" width="10" height="138" rx="5"/><rect x="69" y="202" width="46" height="58" rx="5"/><rect x="147" y="114" width="10" height="160" rx="5"/><rect x="129" y="153" width="46" height="75" rx="5"/></g><g fill="#63d297"><rect x="207" y="54" width="10" height="175" rx="5"/><rect x="189" y="89" width="46" height="99" rx="5"/></g></svg><b>Analisa Dirmu<i>FX</i></b></a>
 <a class="pill" id="accPill" href="index.html#masuk">Masuk</a>
</div></header>
<main class="wrap" id="main"></main>
<script>
const $=id=>document.getElementById(id);
const CFG=window.DFX_FIREBASE||{},ON=!!CFG.apiKey;
let acc=ON?"loading":"guest",items=[],vip={},filt="all",fb=null;
const esc=t=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const GROUP={all:"Semua",emas:"Emas",forex:"Forex",crypto:"Crypto"};
const grp=m=>/XAU|GOLD|EMAS/i.test(m)?"emas":/BTC|ETH|SOL|XRP|BNB|USDT|CRYPTO/i.test(m)?"crypto":"forex";
const BIAS={bullish:"Bullish ↑",bearish:"Bearish ↓",netral:"Netral ↔"};
const fday=d=>{try{return new Date(d+"T00:00:00").toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}catch(e){return d}};
function paintPill(){const p=$("accPill");
 if(acc==="active"){p.className="pill ok";p.textContent="VIP aktif";p.href="index.html#akun"}
 else if(acc==="pending"){p.className="pill";p.textContent="Aktifkan VIP";p.href="index.html#aktivasi"}
 else{p.className="pill";p.textContent="Masuk";p.href="index.html#masuk"}}
function render(){
 let h=`<section class="hero"><span class="eyb">Analisa harian</span><h1>Rencana trading hari ini</h1><p class="lead">Bias, level penting, dan catatan berita untuk emas, forex, dan crypto. Skenario entry lengkap khusus member VIP.</p></section>
 <div class="chips">${Object.keys(GROUP).map(k=>`<button type="button" data-g="${k}" aria-pressed="${filt===k}">${GROUP[k]}</button>`).join("")}</div>`;
 const L=(items||[]).filter(a=>filt==="all"||grp(a.market)===filt);
 if(!ON)h+=`<div class="empty">Analisa harian sedang disiapkan.</div>`;
 else if(items===null)h+=`<div class="empty">Memuat analisa…</div>`;
 else if(!L.length)h+=`<div class="empty">${items.length?"Belum ada analisa untuk pasar ini.":"Belum ada analisa hari ini. Cek lagi nanti atau ikuti update di grup komunitas."}</div>`;
 else{let last="";L.forEach(a=>{if(a.date!==last){h+=`<div class="day">${esc(fday(a.date))}</div>`;last=a.date}
  let v="";if(a.hasVip){if(acc==="active")v=vip[a.id]!=null?`<div class="vip"><b>Skenario VIP</b>\n${esc(vip[a.id])}</div>`:`<div class="vip">Memuat skenario VIP…</div>`;
   else v=`<div class="vip lock"><span>🔒 Skenario entry, SL & TP khusus member VIP.</span><a class="btn green" href="index.html#${acc==="guest"?"daftar":"aktivasi"}">${acc==="guest"?"Daftar":"Aktifkan"}</a></div>`}
  h+=`<article class="an"><div class="anh"><span class="mk">${esc(a.market)}</span><span class="bias ${esc(a.bias)}">${BIAS[a.bias]||esc(a.bias)}</span>${a.tf?`<span class="tf">${esc(a.tf)}</span>`:""}</div>
   <h3>${esc(a.title)}</h3><p>${esc(a.summary)}</p>
   ${a.res||a.sup?`<div class="lv2"><div class="r"><span>Resistance</span><b>${esc(a.res||"—")}</b></div><div class="s"><span>Support</span><b>${esc(a.sup||"—")}</b></div></div>`:""}${v}</article>`})}
 h+=`<p class="disc">⚠️ Analisa bersifat edukasi, bukan saran keuangan. Selalu pakai stop loss dan kelola risiko.</p>`;
 $("main").innerHTML=h;
 document.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{filt=b.dataset.g;render()});
}
async function loadVip(){if(!fb||acc!=="active")return;for(const a of items){if(!a.hasVip||vip[a.id]!=null)continue;
 try{const s=await fb.fs.getDoc(fb.fs.doc(fb.D,"analysisVip",a.id));vip[a.id]=s.exists()?s.data().detail:""}catch(e){vip[a.id]="(Skenario tidak bisa dimuat)"}}render()}
items=null;paintPill();render();
if(ON)(async()=>{try{
 const u="https://www.gstatic.com/firebasejs/10.12.2/";
 const [app,auth,fs]=await Promise.all([import(u+"firebase-app.js"),import(u+"firebase-auth.js"),import(u+"firebase-firestore.js")]);
 const a=app.initializeApp(CFG),A=auth.getAuth(a),D=fs.getFirestore(a);fb={fs,D};
 fs.onSnapshot(fs.query(fs.collection(D,"analysis"),fs.orderBy("createdAt","desc"),fs.limit(40)),s=>{items=s.docs.map(d=>({id:d.id,...d.data()}));render();loadVip()},e=>{console.warn(e);items=[];render()});
 let un=null;auth.onAuthStateChanged(A,us=>{if(un){un();un=null}
  if(!us){acc="guest";paintPill();render();return}
  un=fs.onSnapshot(fs.doc(D,"members",us.uid),s=>{const p=s.data()||{};const t=p.until&&p.until.toMillis?p.until.toMillis():0;
   acc=p.status==="active"&&(!t||t>Date.now())?"active":"pending";paintPill();render();loadVip()},()=>{acc="pending";paintPill();render()});
 });
}catch(e){console.warn(e);items=[];acc="guest";paintPill();render()}})();
</script>
</body>
</html>
