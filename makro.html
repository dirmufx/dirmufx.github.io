<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Riset Makro Mingguan · DirmuFX</title>
<meta name="description" content="Riset makro global mingguan dari DirmuFX: bank sentral, dolar, yield, sentimen risiko, dan dampaknya ke emas, forex, dan crypto. Bahasa sederhana, gratis.">
<meta property="og:title" content="Riset Makro Mingguan DirmuFX">
<meta property="og:description" content="Gambaran besar pasar minggu ini: bank sentral, dolar, sentimen risiko & dampaknya ke emas, forex, crypto.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@500;600;700&display=swap">
<style>
:root{--bg:#141714;--panel:#1c201c;--panel2:#242924;--line:#2c322c;--fg:#eef0e8;--muted:#a6ad9f;--blue:#5b9cf5;--up:#3fbf7f;--down:#e5484d;--amber:#e3b85c;--brand:#63d297;--f:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:radial-gradient(900px 520px at 85% -12%,rgba(91,156,245,.10),transparent 60%),var(--bg);color:var(--fg);font-family:var(--f);font-size:15.5px;line-height:1.6;font-feature-settings:"tnum" 1}
a{color:var(--blue)}
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,0.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .in{max-width:780px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px}
.back{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--fg);text-decoration:none}
.brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0;text-decoration:none;color:var(--fg);font-weight:800;font-size:16.5px;white-space:nowrap}
.brand svg{width:26px;height:auto;flex:none}.brand i{font-style:normal;color:var(--brand)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:9px 13px;font-weight:700;font-size:14px;text-decoration:none;color:var(--fg);white-space:nowrap;cursor:pointer;font-family:inherit}
.wrap{max-width:780px;margin:0 auto;padding:20px 16px 70px}
.kick{font-size:13px;font-weight:700;color:var(--brand)}
h1{font-size:29px;line-height:1.15;margin:4px 0 8px;letter-spacing:-.015em}
.meta{color:var(--muted);font-size:13.5px;margin:0 0 16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 14px}
.card h2{font-size:15px;color:var(--blue);margin:0 0 10px;font-weight:700}
.regime{border-radius:16px;padding:16px;margin:0 0 14px;border:1px solid #e2c0c2;background:linear-gradient(160deg,#f3e8e9,#ffffff 70%)}
.regime.up{border-color:#bee5d1;background:linear-gradient(160deg,#e7f3ec,#ffffff 70%)}.regime.flat{border-color:#e8daba;background:linear-gradient(160deg,#f4efe7,#ffffff 70%)}
.regime b{display:block;font-size:19px;line-height:1.3;margin-bottom:6px}
.regime p{margin:0;color:#5f6f68;font-size:14.5px}
.gauge{margin-top:14px}
.gauge .bar{position:relative;height:10px;border-radius:99px;background:linear-gradient(90deg,#e5484d,#e3b85c 50%,#3fbf7f)}
.gauge .pin{position:absolute;top:-5px;width:4px;height:20px;border-radius:3px;background:#fff;box-shadow:0 0 0 3px rgba(20,50,40,0.1);transform:translateX(-50%)}
.gauge .lab{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px}
.gauge .now{font-size:13.5px;margin-top:8px}
.sum{margin:0;padding:0;list-style:none;counter-reset:s;display:grid;gap:10px}
.sum li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px;font-size:15px;line-height:1.55}
.sum li::before{content:counter(s);width:28px;height:28px;border-radius:9px;background:#e3ecfa;color:#2f5fa8;font-weight:800;display:grid;place-items:center;font-size:14px}
.theme{padding:12px 0;border-top:1px solid var(--line)}.theme:first-of-type{border-top:0;padding-top:0}
.theme h3{margin:0 0 4px;font-size:16px;display:flex;align-items:center;gap:8px}
.theme h3 i{width:9px;height:9px;border-radius:50%;flex:none;background:var(--amber)}.theme h3 i.up{background:var(--up)}.theme h3 i.down{background:var(--down)}
.theme p{margin:0;color:#5f6f68;font-size:14.5px}
.theme .imp{display:inline-block;margin-top:7px;font-size:12.5px;font-weight:700;color:var(--muted);background:var(--panel2);border-radius:8px;padding:3px 9px}
.tblw{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:520px}
th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;padding:6px 6px;border-bottom:1px solid var(--line)}
td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
td b{font-size:14px}
.st{font-size:11.5px;font-weight:800;border-radius:6px;padding:2px 7px;white-space:nowrap}
.st.Hawkish{background:rgba(229,72,77,.15);color:#aa181c}.st.Dovish{background:rgba(63,191,127,.15);color:var(--up)}.st.Netral{background:rgba(227,184,92,.15);color:var(--amber)}
.mk{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.mk>div{background:var(--panel2);border-radius:12px;padding:10px 12px;line-height:1.35}
.mk .k{font-size:12.5px;color:var(--muted)}.mk .v{font-size:19px;font-weight:800;margin:1px 0}.mk .n{font-size:12.5px;color:#5f6f68;line-height:1.4}
@media(min-width:620px){.mk{grid-template-columns:repeat(3,minmax(0,1fr))}}
.as{display:grid;gap:8px}
.as>div{display:grid;grid-template-columns:38px minmax(0,1fr);gap:10px;background:var(--panel2);border-radius:12px;padding:11px 12px}
.as .ar{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:18px;font-weight:800}
.as .ar.up{background:rgba(63,191,127,.15);color:var(--up)}.as .ar.down{background:rgba(229,72,77,.15);color:var(--down)}.as .ar.flat{background:rgba(227,184,92,.15);color:var(--amber)}
.as b{font-size:15px}.as em{font-style:normal;font-size:12.5px;font-weight:700;margin-left:6px}
.as em.up{color:var(--up)}.as em.down{color:var(--down)}.as em.flat{color:var(--amber)}
.as p{margin:2px 0 0;font-size:13.5px;color:#5f6f68;line-height:1.5}
.sc{display:grid;gap:10px}
.sc>div{border:1px solid var(--line);border-radius:12px;padding:12px}
.sc .h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.sc .h b{font-size:15px}.sc .h span{font-weight:800;font-size:18px}
.sc .pb{height:6px;border-radius:99px;background:var(--panel2);margin:7px 0 8px;overflow:hidden}.sc .pb i{display:block;height:100%;border-radius:99px}
.sc p{margin:0;font-size:13.5px;color:#5f6f68;line-height:1.5}.sc p+p{margin-top:4px}
.ag>div{display:grid;grid-template-columns:92px minmax(0,1fr);gap:10px;padding:9px 0;border-top:1px solid var(--line)}.ag div:first-child{border-top:0}
.ag .d{font-weight:700;font-size:13px}.ag .d small{display:block;color:var(--muted);font-weight:500}
.ag b{font-size:14.5px}.ag p{margin:1px 0 0;font-size:13px;color:var(--muted)}
.lesson{background:#e7ecf3;border:1px solid #bfd2ef;border-radius:16px;padding:16px;margin:0 0 14px}
.lesson .kick{color:#2f5fa8}.lesson h3{margin:3px 0 6px;font-size:17px}.lesson p{margin:0;font-size:14.5px;color:#5f6f68}
.promo{display:grid;gap:10px}
.promo a{display:flex;gap:12px;align-items:center;text-decoration:none;color:var(--fg);background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px}
.promo .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:21px;flex:none;background:#e3ecfa}
.promo b{display:block;font-size:15px}.promo span{color:var(--muted);font-size:13px;line-height:1.4}
.src{margin:0;padding-left:18px;font-size:13px;color:var(--muted)}.src li{margin:3px 0}
.arc>div{padding:9px 0;border-top:1px solid var(--line);font-size:13.5px}.arc div:first-child{border-top:0}.arc b{display:block;font-size:13px;color:var(--muted)}
.foot{color:var(--muted);font-size:12.5px;text-align:center;margin-top:22px;line-height:1.6}
.load{color:var(--muted);text-align:center;padding:40px 0}
</style>
<link rel="stylesheet" href="tema.css?v=2">
</head>
<body>
<header class="top"><div class="in">
  <a class="back" href="index.html" aria-label="Kembali ke DirmuFX"><svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M12 5l-5 5 5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
  <a class="brand" href="index.html"><svg viewBox="0 0 314 343" aria-hidden="true"><path d="M15 15H140A156.5 156.5 0 0 1 140 328H15Z" fill="none" stroke="#63d297" stroke-width="30" stroke-linejoin="round"/><g fill="#fff"><rect x="87" y="159" width="10" height="138" rx="5"/><rect x="69" y="202" width="46" height="58" rx="5"/><rect x="147" y="114" width="10" height="160" rx="5"/><rect x="129" y="153" width="46" height="75" rx="5"/></g><g fill="#63d297"><rect x="207" y="54" width="10" height="175" rx="5"/><rect x="189" y="89" width="46" height="99" rx="5"/></g></svg><span>Makro Dirmu<i>FX</i></span></a>
  <button class="btn" id="shareBtn" type="button">📤 Bagikan</button>
</div></header>

<main class="wrap" id="app"><div class="load">Memuat riset makro…</div></main>

<script>
(()=>{
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const arrow=c=>c==="up"?"▲":c==="down"?"▼":"◆";
function render(d){
  const pos=Math.max(0,Math.min(100,(d.risk.score+100)/2));
  $("app").innerHTML=`
  <div class="kick">Riset Makro Mingguan</div>
  <h1>${esc(d.week)}</h1>
  <p class="meta">Diperbarui ${esc(d.date)} · gambaran besar pasar dunia dan dampaknya ke emas, forex & crypto</p>

  <section class="regime ${esc(d.regime.col)}">
    <b>${esc(d.regime.label)}</b><p>${esc(d.regime.desc)}</p>
    <div class="gauge"><div class="bar"><span class="pin" style="left:${pos}%"></span></div>
      <div class="lab"><span>Risk-off (takut)</span><span>Netral</span><span>Risk-on (berani)</span></div>
      <div class="now"><b>${esc(d.risk.label)}.</b> <span class="meta">${esc(d.risk.note)}</span></div></div>
  </section>

  <section class="card"><h2>Minggu ini dalam 30 detik</h2><ol class="sum">${d.summary.map(x=>`<li><span>${esc(x)}</span></li>`).join("")}</ol></section>

  <section class="card"><h2>Tema besar yang menggerakkan pasar</h2>${d.themes.map(t=>`<div class="theme"><h3><i class="${esc(t[1])}"></i>${esc(t[0])}</h3><p>${esc(t[2])}</p><span class="imp">${esc(t[3])}</span></div>`).join("")}</section>

  <section class="card"><h2>Peta bank sentral</h2>
    <div class="tblw"><table><thead><tr><th>Bank sentral</th><th>Bunga</th><th>Langkah terakhir</th><th>Rapat berikutnya</th><th>Sikap</th></tr></thead><tbody>
    ${d.cb.map(c=>`<tr><td><b>${esc(c[0])}</b></td><td><b>${esc(c[1])}</b></td><td>${esc(c[2])}</td><td>${esc(c[3])}<div class="meta" style="margin:2px 0 0;font-size:12px">${esc(c[5])}</div></td><td><span class="st ${esc(c[4])}">${esc(c[4])}</span></td></tr>`).join("")}
    </tbody></table></div>
    <p class="meta" style="margin:10px 0 0">Hawkish = cenderung menaikkan bunga (mata uangnya menguat). Dovish = cenderung menurunkan bunga (mata uangnya melemah).</p>
  </section>

  <section class="card"><h2>Dolar, yield & aset utama</h2><div class="mk">${d.markets.map(m=>`<div><div class="k">${esc(m[0])}</div><div class="v">${esc(m[1])}</div><div class="n">${esc(m[2])}</div></div>`).join("")}</div></section>

  <section class="card"><h2>Dampak ke pasar yang kamu trading</h2><div class="as">${d.assets.map(a=>`<div><span class="ar ${esc(a[1])}">${arrow(a[1])}</span><span><b>${esc(a[0])}</b><em class="${esc(a[1])}">${esc(a[2])}</em><p>${esc(a[3])}</p></span></div>`).join("")}</div>
    <p class="meta" style="margin:10px 0 0">Arah makro membantu memilih sisi (BUY atau SELL). Titik entry tetap cari di <a href="index.html#analisa">Signal Room</a>.</p></section>

  <section class="card"><h2>Skenario minggu ini</h2><div class="sc">${d.scenarios.map(s=>`<div><div class="h"><b>${esc(s[0])}</b><span style="color:${s[4]==="up"?"var(--up)":s[4]==="down"?"var(--down)":"var(--amber)"}">${s[1]}%</span></div><div class="pb"><i style="width:${s[1]}%;background:${s[4]==="up"?"var(--up)":s[4]==="down"?"var(--down)":"var(--amber)"}"></i></div><p><b>Pemicu:</b> ${esc(s[2])}</p><p><b>Dampak:</b> ${esc(s[3])}</p></div>`).join("")}</div>
    <p class="meta" style="margin:10px 0 0">Persentase adalah perkiraan kasar DirmuFX, bukan kepastian.</p></section>

  <section class="card"><h2>Agenda penting</h2><div class="ag">${d.agenda.map(a=>`<div><span class="d">${esc(a[0])}${a[1]?`<small>${esc(a[1])} WITA</small>`:""}</span><span><b>${esc(a[2])}</b><p>${esc(a[3])}</p></span></div>`).join("")}</div>
    <p class="meta" style="margin:10px 0 0">Jadwal lengkap dengan angka aktual ada di <a href="index.html#kalender">Kalender</a>.</p></section>

  ${d.lesson?`<section class="lesson"><div class="kick">Belajar makro</div><h3>${esc(d.lesson.title)}</h3><p>${esc(d.lesson.text)}</p><p style="margin-top:8px"><a href="belajar.html">Pelajari lebih lanjut di Akademi DirmuFX →</a></p></section>`:""}

  <section class="card"><h2>Lanjutkan di DirmuFX</h2><div class="promo">
    <a href="index.html#fundamental"><span class="ic">🌐</span><div><b>Fundamental harian</b><span>Ringkasan per pair, diperbarui setiap pagi dan sore.</span></div></a>
    <a href="index.html#analisa"><span class="ic">📈</span><div><b>Signal Room</b><span>Sinyal entry, SL, TP, matriks tren & peringatan berita merah.</span></div></a>
    <a href="jurnal.html"><span class="ic">📒</span><div><b>Jurnal trading gratis</b><span>Catat trade dan lihat kebiasaan yang bikin rugi.</span></div></a>
    <a href="https://puvip.co/la-partners/id/ztmYc1S9" target="_blank" rel="noopener"><span class="ic">🏦</span><div><b>Buka akun PU Prime (min. $30)</b><span>Daftar lewat link DirmuFX untuk akses VIP.</span></div></a>
  </div></section>

  ${d.archive&&d.archive.length?`<section class="card"><h2>Riset minggu sebelumnya</h2><div class="arc">${d.archive.slice(0,8).map(a=>`<div><b>${esc(a[0])}</b>${esc(a[1])}</div>`).join("")}</div></section>`:""}

  <section class="card"><h2>Sumber</h2><ol class="src">${d.sources.map(s=>`<li><a href="${esc(s[1])}" target="_blank" rel="noopener">${esc(s[0])}</a></li>`).join("")}</ol></section>
  <p class="foot">Riset Makro DirmuFX · <a href="index.html">dirmufx.github.io</a><br>Bukan saran keuangan. Trading berisiko tinggi, selalu pakai stop loss.</p>`;
  document.title="Riset Makro "+d.week+" · DirmuFX";
}
fetch("data/makro.json?h="+Math.floor(Date.now()/9e5),{cache:"no-store"}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(render)
 .catch(()=>{$("app").innerHTML='<div class="load">Riset belum bisa dimuat. Coba muat ulang halaman.</div>'});
$("shareBtn").onclick=async()=>{const data={title:"Riset Makro Mingguan DirmuFX",text:"Gambaran besar pasar minggu ini: bank sentral, dolar & dampaknya ke emas, forex, crypto. Gratis dari DirmuFX.",url:location.href.split("#")[0]};
  try{if(navigator.share){await navigator.share(data);return}}catch(e){if(e&&e.name==="AbortError")return}
  try{await navigator.clipboard.writeText(data.text+" "+data.url);$("shareBtn").textContent="✓ Link disalin"}catch(e){prompt("Salin link:",data.url)}};
})();
</script>
</body>
</html>
