name: Perbarui kalender ekonomi

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/kalender.yml", ".github/scripts/ff_calendar.py"]

permissions:
  contents: write

concurrency:
  group: kalender
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ambil kalender Forex Factory (dengan actual)
        run: python3 .github/scripts/ff_calendar.py
      - name: Simpan jika berubah
        run: |
          git config user.name "dirmufx-bot"
          git config user.email "dirmufx-bot@users.noreply.github.com"
          git add data/ff_thisweek.json
          if git diff --cached --quiet; then echo "tidak ada perubahan"; exit 0; fi
          git commit -m "Perbarui kalender ekonomi"
          git pull --rebase -q origin main || true
          git push
